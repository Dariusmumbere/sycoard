<script>
/* ==========================================================================
   RANKCO ENGINE
   Pure, deterministic and serialisable. No DOM, no timers, no globals.

   state' = apply(state, action).state   (+ an ordered list of events for the UI)

   Online multiplayer later: run this same engine on a server, send `action`
   objects over the wire, and have the server pass the authoritative dice value
   as apply(state, {type:'roll'}, {dice: n}). The UI only renders state/events,
   so no part of the engine needs rewriting. Seats already carry a `type`
   ('human' | 'ai' | 'remote').
   ========================================================================== */
const RankcoEngine = (() => {
  'use strict';

  const COLORS = ['blue', 'red', 'green', 'orange'];      // clockwise seating order
  const SIDE = 9;                                          // tiles on each side of the board
  const RING = 4 * SIDE;                                   // 36 tiles on the shared loop (10 x 10 board)
  const LANE = 3;                                          // arrow tiles inside the board that lead to the centre
  const LAYERS = 4;                                        // 4 rounds, each on its own layer: outer ring (star 1) ... inner ring (star 4)
  const S_OF = [9, 7, 5, 3];                               // tiles per side on each layer
  const R_OF = S_OF.map((x) => x * 4);                     // 36, 28, 20, 12 tiles per layer
  const OFF = [0, 36, 64, 84];                             // first progress value / first tile id of each layer
  const GOAL = 96;                                         // progress value of the centre (36 + 28 + 20 + 12)                                // progress value of the centre (39)
  const YARD = -1;                                         // token outside the board
  const FREEZE_FROM = OFF[2];                                // three-star and four-star levels
  const START_COINS = 2;
  // Each colour owns one side of the board; its home tile is the corner where the side begins.
  const START_INDEX = { blue: 0, red: 9, green: 18, orange: 27 };
  // Salutation tiles sit in the middle of each side.
  const SALUTE_OWNER = { 4: 'blue', 13: 'red', 22: 'green', 31: 'orange' };

  /* ---------- helpers ---------- */
  function rand(s) {                                       // mulberry32, seed lives in state
    s.seed = (s.seed + 0x6D2B79F5) | 0;
    let t = Math.imul(s.seed ^ (s.seed >>> 15), 1 | s.seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const clone = (s) => JSON.parse(JSON.stringify(s));
  const tileOf = (pl, p) => (p < 0 || p >= GOAL ? -1 : OFF[layerOf(p)] + (COLORS.indexOf(pl.color) * S_OF[layerOf(p)] + p - OFF[layerOf(p)]) % R_OF[layerOf(p)]);   // -1: off the loop (waiting, on the arrow lane, or home)
  const levelOf = (p) => (p < 0 ? 0 : p >= GOAL ? 5 : layerOf(p) + 1);
  const inPlay = (t) => t.p >= 0 && t.p < GOAL;
  const layerOf = (p) => (p < 36 ? 0 : p < 64 ? 1 : p < 84 ? 2 : 3);
  const isHome = (p) => OFF.includes(p);                   // a colour's home corner on any layer
  const layerPos = (pl, p) => { const L = layerOf(p); return { L, k: (COLORS.indexOf(pl.color) * S_OF[L] + p - OFF[L]) % R_OF[L] }; };

  /* ---------- setup ---------- */
  function createGame(cfg) {
    const seeded = cfg.seed != null ? cfg.seed : (Math.random() * 4294967296) >>> 0;
    const sorted = cfg.players.slice().sort((a, b) => COLORS.indexOf(a.color) - COLORS.indexOf(b.color));
    const players = sorted.map((p, i) => ({
      id: i, name: p.name, color: p.color, type: p.type || 'human', difficulty: p.difficulty || null,
      coins: START_COINS, spent: 0,
      tokens: [{ id: 0, p: YARD, frozen: false }, { id: 1, p: YARD, frozen: false }],
      stats: { rolls: 0, sixes: 0, setbacksGiven: 0, setbacksTaken: 0, coinsSpent: 0, salutes: 0, freezes: 0 }
    }));
    const s = { v: 1, seed: seeded, players, turn: 0, phase: 'roll', awaiting: 0, roll: null, lastRoll: null,
                bonus: false, pending: null, winner: null, turnCount: 0 };
    let first = cfg.startColor ? players.findIndex((p) => p.color === cfg.startColor) : -1;
    if (first < 0) first = Math.floor(rand(s) * players.length);
    s.turn = s.awaiting = first;
    return s;
  }

  /* ---------- movement rules ---------- */
  // Tokens of the same player cannot skip over or land on each other.
  function canMove(pl, tok, v) {
    if (!inPlay(tok) || tok.frozen) return false;
    const to = tok.p + v;
    return !pl.tokens.some((o) => o !== tok && inPlay(o) && o.p > tok.p && o.p <= to);
  }
  const startFree = (pl) => !pl.tokens.some((t) => t.p === 0);

  function tokensOnTile(s, tile, except) {
    const out = [];
    s.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => {
      if (inPlay(t) && tileOf(pl, t.p) === tile && !(except && except.pi === pi && except.ti === ti)) out.push({ pi, ti });
    }));
    return out;
  }

  /* ---------- options ---------- */
  function listOptions(s) {
    if (s.phase === 'over') return [];
    if (s.phase === 'setback') {
      const v = s.pending.victims[0];
      return [{ type: 'setback_pay', token: v.ti, paid: true }, { type: 'setback_accept', token: v.ti }];
    }
    const P = s.players[s.turn];
    if (s.phase === 'roll') {
      const o = [{ type: 'roll' }];
      if (P.coins > 0) P.tokens.forEach((t) => { if (t.frozen && inPlay(t)) o.push({ type: 'unfreeze_pay', token: t.id, paid: true }); });
      return o;
    }
    // phase === 'act'
    const v = s.roll, free = [], paid = [];
    let yardSeen = false;
    P.tokens.forEach((t) => {
      if (t.p === GOAL) return;
      if (t.p === YARD) {
        if (yardSeen || !startFree(P)) return;
        yardSeen = true;
        if (v === 6) free.push({ type: 'enter', token: t.id });
        else if (P.coins > 0) paid.push({ type: 'enter_pay', token: t.id, paid: true });
      } else if (t.frozen) {
        if (v === 6) free.push({ type: 'unfreeze', token: t.id });
        if (P.coins > 0) paid.push({ type: 'unfreeze_pay', token: t.id, paid: true });
      } else if (v === 1 && t.p >= FREEZE_FROM) {
        free.push({ type: 'freeze', token: t.id });          // rolling a 1 at three/four-star freezes it
      } else if (canMove(P, t, v)) {
        free.push({ type: 'move', token: t.id });
      }
    });
    if (s.bonus && P.spent > 0) free.push({ type: 'recover' });
    if (free.length === 0) free.push({ type: 'pass', free0: true });
    // 'pass' is only a real choice when a paid alternative exists; otherwise it is automatic
    return free.concat(paid);
  }

  // The single obvious action, if any (controllers apply it after a short pause).
  function autoAction(s) {
    if (s.phase !== 'act') return null;
    const o = listOptions(s);
    if (o.length === 1) { const a = Object.assign({}, o[0]); delete a.free0; return a; }
    return null;
  }

  const same = (o, a) => o.type === a.type && (o.token === undefined || o.token === a.token);

  /* ---------- internals ---------- */
  function spendCoin(s, pi, events, reason) {
    const pl = s.players[pi];
    pl.coins--; pl.spent++; pl.stats.coinsSpent++;
    events.push({ t: 'coin', pi, reason });
  }

  function doMove(s, pi, ti, steps, events, allowSalute) {
    const pl = s.players[pi], tok = pl.tokens[ti];
    const from = tok.p, to = Math.min(from + steps, GOAL), path = [];
    for (let q = from + 1; q <= to; q++) path.push(q);
    tok.p = to;
    events.push({ t: 'move', pi, ti, from, to, steps, path });
    if (to === GOAL) { events.push({ t: 'finish', pi, ti }); s.pending = null; return; }
    startLanding(s, pi, ti, allowSalute, events);
  }

  function startLanding(s, pi, ti, allowSalute, events) {
    const pl = s.players[pi], tok = pl.tokens[ti], tile = tileOf(pl, tok.p);
    if (tile < 0) { s.pending = { pi, ti, victims: [], salute: false, decided: false }; return; }   // the arrow lane is safe ground
    const victims = [];
    s.players.forEach((op, oi) => {
      if (oi === pi) return;
      op.tokens.forEach((ot, oti) => {
        // home tile protects; frozen tokens are unaffected by setbacks
        if (inPlay(ot) && !ot.frozen && !isHome(ot.p) && tileOf(op, ot.p) === tile) victims.push({ pi: oi, ti: oti });
      });
    });
    let salute = false;
    const ownerColor = SALUTE_OWNER[tile];
    if (allowSalute && ownerColor && ownerColor !== pl.color) {
      const oi = s.players.findIndex((p) => p.color === ownerColor);
      if (oi >= 0 && canMove(pl, tok, 3)) {
        salute = true; pl.stats.salutes++;
        events.push({ t: 'salute', pi, ti, owner: oi, tile });
      }
    }
    s.pending = { pi, ti, victims, salute, decided: false };
  }

  function applySetback(s, v, pd, events) {
    const op = s.players[v.pi], tok = op.tokens[v.ti], from = tok.p;
    const path = [from];
    let q = from - 6;
    // keep going back 6 tiles while the landing tile is occupied
    while (q >= 0 && tokensOnTile(s, tileOf(op, q), { pi: v.pi, ti: v.ti }).length) { path.push(q); q -= 6; }
    if (q < 0) q = YARD;
    path.push(q);
    tok.p = q; tok.frozen = false;
    op.stats.setbacksTaken++; s.players[pd.pi].stats.setbacksGiven++;
    events.push({ t: 'setback', pi: v.pi, ti: v.ti, from, to: q, path, by: pd.pi });
  }

  // Resolve landings until a human/AI decision is needed ('wait') or everything is settled ('done').
  function runPending(s, events) {
    while (s.pending) {
      const pd = s.pending;
      if (pd.victims.length) {
        const v = pd.victims[0];
        if (s.players[v.pi].coins > 0 && !pd.decided) { s.phase = 'setback'; s.awaiting = v.pi; return 'wait'; }
        pd.decided = false; pd.victims.shift();
        applySetback(s, v, pd, events);
        continue;
      }
      if (pd.salute) {                                       // 3 bonus moves, taken immediately
        pd.salute = false;
        const pl = s.players[pd.pi];
        if (canMove(pl, pl.tokens[pd.ti], 3)) doMove(s, pd.pi, pd.ti, 3, events, false);
        continue;
      }
      s.pending = null;
    }
    s.phase = 'act'; s.awaiting = s.turn;
    return 'done';
  }

  function finish(s, events) {
    const w = s.players.find((pl) => pl.tokens.every((t) => t.p === GOAL));
    if (w) { s.phase = 'over'; s.winner = w.id; s.awaiting = null; s.roll = null; events.push({ t: 'win', pi: w.id }); return; }
    if (s.roll === 6) {                                      // rolling a 6 earns a bonus roll
      s.phase = 'roll'; s.bonus = true; s.roll = null; s.awaiting = s.turn;
      events.push({ t: 'bonus', pi: s.turn });
    } else {
      s.turn = (s.turn + 1) % s.players.length;
      s.phase = 'roll'; s.bonus = false; s.roll = null; s.awaiting = s.turn; s.turnCount++;
      events.push({ t: 'turn', pi: s.turn });
    }
  }

  /* ---------- the one entry point ---------- */
  function apply(state, action, opts) {
    const s = clone(state), events = [];
    if (s.phase === 'over') return { error: 'game over' };
    if (!listOptions(s).some((o) => same(o, action))) return { error: 'illegal action', action };
    const pi = s.phase === 'setback' ? s.awaiting : s.turn;
    const P = s.players[pi];
    const tok = action.token !== undefined ? P.tokens[action.token] : null;
    const duringRoll = s.phase === 'roll';

    switch (action.type) {
      case 'roll': {
        const v = opts && opts.dice ? opts.dice : 1 + Math.floor(rand(s) * 6);
        s.roll = s.lastRoll = v; P.stats.rolls++; if (v === 6) P.stats.sixes++;
        s.phase = 'act';
        events.push({ t: 'roll', pi, value: v, bonus: s.bonus });
        return { state: s, events };
      }
      case 'unfreeze_pay':
        spendCoin(s, pi, events, 'unfreeze'); tok.frozen = false;
        events.push({ t: 'unfreeze', pi, ti: tok.id, paid: true });
        if (duringRoll) return { state: s, events };         // still to roll this turn
        finish(s, events); return { state: s, events };
      case 'unfreeze':
        tok.frozen = false; events.push({ t: 'unfreeze', pi, ti: tok.id, paid: false });
        finish(s, events); return { state: s, events };
      case 'freeze':
        tok.frozen = true; P.stats.freezes++; events.push({ t: 'freeze', pi, ti: tok.id });
        finish(s, events); return { state: s, events };
      case 'recover':
        P.coins++; P.spent--; events.push({ t: 'recover', pi });
        finish(s, events); return { state: s, events };
      case 'pass':
        events.push({ t: 'pass', pi });
        finish(s, events); return { state: s, events };
      case 'enter': case 'enter_pay':
        if (action.type === 'enter_pay') spendCoin(s, pi, events, 'enter');
        tok.p = 0; events.push({ t: 'enter', pi, ti: tok.id, paid: action.type === 'enter_pay' });
        startLanding(s, pi, tok.id, false, events);
        break;
      case 'move':
        doMove(s, pi, tok.id, s.roll, events, true);
        break;
      case 'setback_pay': {
        spendCoin(s, pi, events, 'hold');
        const v = s.pending.victims.shift();
        events.push({ t: 'hold', pi: v.pi, ti: v.ti });
        s.pending.decided = false;
        break;
      }
      case 'setback_accept':
        s.pending.decided = true;
        break;
    }
    if (runPending(s, events) === 'done') finish(s, events);
    return { state: s, events };
  }

  /* ---------- reporting ---------- */
  const progressOf = (pl) => pl.tokens.reduce((a, t) => a + (t.p < 0 ? 0 : t.p), 0);
  function ranking(s) {
    return s.players.map((pl) => ({ pl, score: progressOf(pl) + (pl.id === s.winner ? 1000 : 0) }))
      .sort((a, b) => b.score - a.score).map((x) => x.pl);
  }

  return { COLORS, SIDE, RING, LAYERS, S_OF, R_OF, OFF, LANE, GOAL, YARD, FREEZE_FROM, START_INDEX, SALUTE_OWNER,
           createGame, listOptions, autoAction, apply, canMove, tileOf, levelOf, inPlay, layerOf, layerPos, isHome, progressOf, ranking };
})();


</script>
<script>
/* ==========================================================================
   RANKCO AI  (Easy / Medium / Hard)
   Controllers only ever return an `action` the engine already listed as legal,
   so a remote/online controller can replace this module without touching the engine.
   ========================================================================== */
const RankcoAI = (() => {
  'use strict';
  const E = RankcoEngine;
  const COIN_VALUE = { medium: 4.5, hard: 5.5 };

  const pick = (a, r) => a[Math.floor(r() * a.length)];

  // Positive = good for player `me`.
  function evaluate(s, me, d) {
    const P = s.players[me];
    let score = P.coins * COIN_VALUE[d];
    const risk = d === 'hard' ? 1 : 0.5;
    P.tokens.forEach((t) => {
      if (t.p === E.GOAL) { score += E.GOAL + 70; return; }
      if (t.p >= 0) score += t.p + 8;
      if (t.frozen) score -= d === 'hard' ? 10 : 6;
      if (E.inPlay(t) && !t.frozen && t.p > 0) {
        const mp = E.layerPos(P, t.p);
        s.players.forEach((op, oi) => {
          if (oi === me) return;
          op.tokens.forEach((ot) => {
            if (!E.inPlay(ot) || ot.frozen) return;
            const oq = E.layerPos(op, ot.p); if (oq.L !== mp.L) return;
            const dist = (mp.k - oq.k + E.R_OF[mp.L]) % E.R_OF[mp.L];
            if (dist >= 1 && dist <= 6) {
              const loss = (t.p <= 6 ? t.p + 8 : 6) * (P.coins > 0 ? 0.6 : 1);
              score -= (1 / 6) * loss * risk;
            }
          });
        });
        if (d === 'hard' && t.p >= E.FREEZE_FROM) score -= 1.6;   // a roll of 1 would freeze it
      }
    });
    s.players.forEach((op, oi) => {
      if (oi === me) return;
      op.tokens.forEach((t) => {
        if (t.p === E.GOAL) score -= 0.6 * (E.GOAL + 9); else if (t.p >= 0) score -= 0.6 * (t.p + 8);
        if (t.frozen) score += 3;
      });
    });
    return score;
  }

  function simulate(s, a) {
    let r = E.apply(s, a);
    if (r.error) return null;
    let st = r.state, guard = 0;
    while (st.phase === 'setback' && guard++ < 6) {           // assume opponents accept setbacks
      r = E.apply(st, { type: 'setback_accept' });
      if (r.error) break;
      st = r.state;
    }
    return st;
  }

  function chooseAct(s, difficulty, r) {
    const me = s.turn, opts = E.listOptions(s);
    const freeOpts = opts.filter((o) => !o.paid && o.type !== 'pass');
    const paidOpts = opts.filter((o) => o.paid);
    const pass = { type: 'pass' };

    if (difficulty === 'beginner') return freeOpts.length ? pick(freeOpts, r) : pass;   // random legal move, never spends coins
    if (difficulty === 'easy') {
      if (freeOpts.length) {
        const enter = freeOpts.find((o) => o.type === 'enter');
        if (enter && r() < 0.8) return enter;
        return pick(freeOpts, r);
      }
      if (paidOpts.length && r() < 0.35) return pick(paidOpts, r);
      return pass;
    }
    const jitter = difficulty === 'hard' ? 0.2 : 1.6;
    let best = null, bestScore = -Infinity;
    const cands = freeOpts.concat(paidOpts);
    cands.push(pass);
    cands.forEach((a) => {
      const st = simulate(s, a);
      if (!st) return;
      const sc = evaluate(st, me, difficulty) + (r() - 0.5) * jitter;
      if (sc > bestScore) { bestScore = sc; best = a; }
    });
    return best || pass;
  }

  function choose(s, difficulty, r) {
    r = r || Math.random;
    difficulty = difficulty || 'medium';
    const opts = E.listOptions(s);
    if (s.phase === 'roll') {
      const P = s.players[s.turn];
      const un = opts.find((o) => o.type === 'unfreeze_pay');
      if (un && difficulty !== 'easy' && difficulty !== 'beginner') {
        const t = P.tokens[un.token];
        const worth = difficulty === 'hard' ? t.p >= 30 && (P.coins === 2 || t.p >= 70) : t.p >= 50 && P.coins === 2;
        if (worth) return un;
      }
      return { type: 'roll' };
    }
    if (s.phase === 'setback') {
      const v = s.pending.victims[0], op = s.players[v.pi], t = op.tokens[v.ti];
      // estimate what the setback would cost
      let q = t.p - 6;
      const loss = q < 0 ? t.p + 8 : 6;
      if (difficulty === 'beginner') return { type: 'setback_accept', token: v.ti };
      if (difficulty === 'easy') return r() < 0.3 ? { type: 'setback_pay', token: v.ti } : { type: 'setback_accept', token: v.ti };
      const threshold = difficulty === 'hard' ? (op.coins === 1 ? 9 : 7) : 10;
      return loss >= threshold || t.p >= 58 ? { type: 'setback_pay', token: v.ti } : { type: 'setback_accept', token: v.ti };
    }
    const auto = E.autoAction(s);
    if (auto) return auto;
    return chooseAct(s, difficulty, r);
  }

  return { choose, evaluate };
})();


</script>
<script>
/* ==========================================================================
   RANKCO UI  – screens, setup flow, board rendering, game controller.
   Talks to the engine only through RankcoEngine.apply / listOptions, so an
   online controller can later feed the same `dispatch(action)` from a socket.
   ========================================================================== */
(() => {
  'use strict';
  const E = RankcoEngine, AI = RankcoAI;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HEX = { blue: '#2b7de9', red: '#e0292e', green: '#1e9e4a', orange: '#f39419' };
  const LIGHT = { blue: '#7db6ff', red: '#ff8a8d', green: '#62dd8b', orange: '#ffc06a' };
  const CNAME = { blue: 'Blue', red: 'Red', green: 'Green', orange: 'Orange' };
  const DIFF = { beginner: 'Beginner', easy: 'Easy', medium: 'Medium', hard: 'Hard' };
  const COIN = '<svg class="rc sm" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg>';
  const COINI = '<svg class="rc xs" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg>';

  const MODES = {
    computer: { icon: '🤖', title: 'Play vs Computer', desc: 'Challenge the computer in an exciting game of RANKCO.', tag: 'Easy · Medium · Hard' },
    two:      { icon: '👥', title: 'Two Players', desc: 'Challenge a friend in a two-player match.', humans: 2, tag: 'Same device' },
    three:    { icon: '👨‍👦‍👦', title: 'Three Players', desc: 'Bring another player into the competition.', humans: 3, tag: 'Same device' },
    four:     { icon: '👨‍👩‍👦‍👦', title: 'Four Players', desc: 'Experience the complete RANKCO competition.', humans: 4, tag: 'Same device' },
  };
  const MODE_KEYS = ['computer', 'two', 'three', 'four'];

  /* app-level state – survives navigation so Back never loses selections */
  const app = { screen: 'splash', mode: null, setups: {}, session: null, busy: false, loop: 0, opts: [], view: {}, log: [] };

  /* ===================================================================
     NAVIGATION
     =================================================================== */
  const ORDER = ['splash', 'welcome', 'modes', 'setup', 'game', 'results'];
  function go(name) {
    const idx = ORDER.indexOf(name);
    ORDER.forEach((n, i) => {
      const el = $('#s-' + n);
      el.classList.toggle('active', i === idx);
      el.classList.toggle('before', i < idx);
    });
    app.screen = name;
    const ap = $('#app'); ap.scrollLeft = 0; ap.scrollTop = 0;   // never let the parked (off-screen) screens scroll the app sideways
    const el = $('#s-' + name);
    if (el.scrollTo) el.scrollTo(0, 0);
  }

  /* ===================================================================
     SCREEN 1 – welcome
     =================================================================== */
  function buildOrbit() {
    let h = '<svg viewBox="-100 -100 200 200">';
    for (let k = 0; k < 40; k++) {
      const side = Math.floor(k / 10), ang = k * 9 - 45;
      h += `<rect x="-3.1" y="-97" width="6.2" height="8.6" rx="1.7" fill="${HEX[E.COLORS[side]]}" transform="rotate(${ang})" style="animation-delay:${(k * 0.12).toFixed(2)}s"/>`;
    }
    $('#orbit').innerHTML = h + '</svg>';
  }
  $('#playNow').onclick = () => { renderModes(); go('modes'); };

  /* ===================================================================
     SCREEN 2 – game modes
     =================================================================== */
  function renderModes() {
    $('#modeGrid').innerHTML = MODE_KEYS.map((k) => {
      const m = MODES[k];
      return `<button class="mode${app.mode === k ? ' selected' : ''}" data-mode="${k}" aria-pressed="${app.mode === k}">
        <span class="check">✓</span><span class="ico">${m.icon}</span><h3>${m.title}</h3><p>${m.desc}</p><span class="tag">${m.tag}</span></button>`;
    }).join('');
    $$('.mode').forEach((b) => b.onclick = () => {
      app.mode = b.dataset.mode;
      $$('.mode').forEach((x) => x.classList.toggle('selected', x === b));
      setTimeout(() => { renderSetup(); go('setup'); }, 320);
    });
  }
  $('#modesBack').onclick = () => go('welcome');

  /* ===================================================================
     SCREEN 3 – player setup
     =================================================================== */
  function ensureSetup(mode) {
    if (!app.setups[mode]) {
      const prev = Object.values(app.setups)[0];
      app.setups[mode] = {
        names: prev ? prev.names.slice() : ['Player 1', 'Player 2', 'Player 3', 'Player 4'],
        colors: mode === 'three' || mode === 'four' ? ['blue', 'red', 'green', 'orange'] : ['blue', 'green', 'red', 'orange'],
        aiCount: 1, difficulty: 'medium', first: 'random',
      };
    }
    return app.setups[mode];
  }
  function seatsOf(mode) {
    const s = ensureSetup(mode);
    const count = mode === 'computer' ? 1 + s.aiCount : MODES[mode].humans;
    return Array.from({ length: count }, (_, i) => {
      const ai = mode === 'computer' && i > 0;
      return { idx: i, ai, color: s.colors[i], name: ai ? (s.aiCount > 1 ? `Computer ${i}` : 'Computer') : (s.names[i].trim() || `Player ${i + 1}`) };
    });
  }

  function renderSetup() {
    const mode = app.mode, m = MODES[mode], s = ensureSetup(mode);
    const root = $('#setupRoot');
    root.innerHTML = `
      <button class="back" id="setupBack">‹ Back</button>
      <h2 class="pill-title">Player Setup</h2>
      <div class="mode-chip" style="margin-top:18px"><span class="ico">${m.icon}</span><div><small>SELECTED MODE</small><b>${m.title}</b></div><button class="btn dark" id="chg">Change</button></div>
      <div class="setup-grid">
        <div class="form glass" id="form"></div>
        <div class="summary glass" id="summary"></div>
      </div>`;
    $('#setupBack').onclick = () => { renderModes(); go('modes'); };
    $('#chg').onclick = () => { renderModes(); go('modes'); };
    renderForm();
    renderSummary();
  }

  function renderForm() {
    const mode = app.mode, s = ensureSetup(mode), seats = seatsOf(mode);
    let h = '';
    if (mode === 'computer') {
      h += `<div class="row"><label>Computer opponents</label><div class="seg" id="aiCount">${[1, 2, 3].map((n) => `<button data-v="${n}" class="${s.aiCount === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
            <div class="row"><label>AI difficulty</label><div class="seg" id="diff">${['beginner', 'easy', 'medium', 'hard'].map((d) => `<button data-v="${d}" class="${s.difficulty === d ? 'on' : ''}">${DIFF[d]}</button>`).join('')}</div></div>`;
    }
    h += `<div class="row"><label>${mode === 'computer' ? 'You &amp; your opponents' : 'Players'}</label>`;
    seats.forEach((st) => {
      h += `<div class="seat" style="--c:${HEX[st.color]}"><div class="num">${st.idx + 1}</div>
        ${st.ai ? `<div class="ai-name">🤖 ${esc(st.name)}<small>${DIFF[s.difficulty]} · AI</small></div>`
                : `<input class="name" data-i="${st.idx}" maxlength="14" value="${esc(s.names[st.idx])}" placeholder="Player ${st.idx + 1}" aria-label="Player ${st.idx + 1} name" autocomplete="off">`}
        <div class="swatches" role="group" aria-label="Colour">${E.COLORS.map((c) => `<button class="sw${st.color === c ? ' on' : ''}" style="--c:${HEX[c]}" data-i="${st.idx}" data-c="${c}" title="${CNAME[c]}" aria-label="${CNAME[c]}"></button>`).join('')}</div></div>`;
    });
    h += '</div>';
    h += `<div class="row"><label>Who starts?</label><div class="seg" id="first"></div></div>`;
    $('#form').innerHTML = h;

    const again = () => { renderForm(); renderSummary(); };
    if (mode === 'computer') {
      $$('#aiCount button').forEach((b) => b.onclick = () => { s.aiCount = +b.dataset.v; s.first = 'random'; again(); });
      $$('#diff button').forEach((b) => b.onclick = () => { s.difficulty = b.dataset.v; again(); });
    }
    $$('.name').forEach((inp) => inp.oninput = () => { s.names[+inp.dataset.i] = inp.value; renderSummary(); renderFirst(); });
    $$('.sw').forEach((b) => b.onclick = () => {
      const i = +b.dataset.i, c = b.dataset.c, j = s.colors.indexOf(c);
      if (j !== i) { s.colors[j] = s.colors[i]; s.colors[i] = c; }          // swap so colours stay unique
      again();
    });
    renderFirst();
  }

  function renderFirst() {
    const s = ensureSetup(app.mode), seats = seatsOf(app.mode);
    if (s.first !== 'random' && !seats.some((x) => x.color === s.first)) s.first = 'random';
    $('#first').innerHTML = `<button data-v="random" class="${s.first === 'random' ? 'on' : ''}">🎲 Random</button>` +
      seats.map((x) => `<button data-v="${x.color}" class="${s.first === x.color ? 'on' : ''}"><span class="dot" style="background:${HEX[x.color]}"></span>${esc(x.name)}</button>`).join('');
    $$('#first button').forEach((b) => b.onclick = () => { s.first = b.dataset.v; renderFirst(); renderSummary(); });
  }

  function renderSummary() {
    const mode = app.mode, m = MODES[mode], s = ensureSetup(mode);
    const seats = seatsOf(mode).slice().sort((a, b) => E.COLORS.indexOf(a.color) - E.COLORS.indexOf(b.color));
    const firstTxt = s.first === 'random' ? 'Random' : seats.find((x) => x.color === s.first).name;
    $('#summary').innerHTML = `
      <div class="lbl">Game summary</div>
      <div class="facts">
        <div class="fact"><small>Mode</small><b>${m.icon} ${m.title}</b></div>
        <div class="fact"><small>${mode === 'computer' ? 'Difficulty' : 'Device'}</small><b>${mode === 'computer' ? DIFF[s.difficulty] : 'Pass &amp; play'}</b></div>
        <div class="fact"><small>Players</small><b>${seats.length}</b></div>
        <div class="fact"><small>First turn</small><b>${esc(firstTxt)}</b></div>
      </div>
      <div class="lbl">Turn order · clockwise</div>
      <ul class="sum-list">${seats.map((x) => `<li style="--c:${HEX[x.color]}"><span class="c"></span>${esc(x.name)}<span class="t">${CNAME[x.color]}<br>${x.ai ? DIFF[s.difficulty] + ' AI' : 'Human'}</span></li>`).join('')}</ul>
      <button class="btn start" id="startGame" style="margin-top:18px">Start Game</button>`;
    $('#startGame').onclick = startGame;
  }

  /* ===================================================================
     GAME – board drawing
     =================================================================== */
  const ringXY = (k) => (k < 9 ? [k, 0] : k < 18 ? [9, k - 9] : k < 27 ? [9 - (k - 18), 9] : [0, 9 - (k - 27)]);   // [col,row] on the 10 x 10 grid, clockwise from the top-left corner
  const cellXY = (c, r) => [c * 10 + 5, r * 10 + 5];
  const layerXY = (L, k) => { const S = 9 - 2 * L, a = Math.floor(k / S), j = k % S; return a === 0 ? [L + j, L] : a === 1 ? [9 - L, L + j] : a === 2 ? [9 - L - j, 9 - L] : [L, 9 - L - j]; };   // [col,row] of tile k on layer L, clockwise from that layer's top-left corner
  const tileCenter = (id) => { const L = id < 36 ? 0 : id < 64 ? 1 : id < 84 ? 2 : 3; const [c, r] = layerXY(L, id - E.OFF[L]); return cellXY(c, r); };
  const rotCell = (r, c, n) => { for (let i = 0; i < n; i++) [r, c] = [c, 9 - r]; return [r, c]; };   // n quarter turns clockwise
  const rotOff = (o, n) => { let [x, y] = o; for (let i = 0; i < n; i++) [x, y] = [-y, x]; return [x, y]; };
  const cIdx = (color) => E.COLORS.indexOf(color);
  const LANE0 = [[1, 7], [2, 6], [3, 5]];                        // red's arrow lane (row, col); the other colours are quarter turns of it
  const laneXY = (n, j) => { const [r, c] = rotCell(LANE0[j][0], LANE0[j][1], (n + 3) % 4); return cellXY(c, r); };
  const DONE_C = [[44, 56], [44, 44], [56, 44], [56, 56]];       // finished tokens rest in the corner of the centre square their lane points at
  const doneXY = (n, ti) => { const [x, y] = DONE_C[n], dx = Math.sign(x - 50), dy = Math.sign(y - 50), k = ti ? 1.55 : -1.55; return [x - k * dy, y + k * dx]; };
  // waiting tokens and coins sit in a small tray outside the leather frame, next to the player's own home corner
  const TRAY = { blue: [-7, -19], red: [61, -19], green: [61, 112], orange: [-7, 112] }, TRAY_W = 46, TRAY_H = 10;
  const yardXY = (color, ti) => [TRAY[color][0] + 6.5 + ti * 10, TRAY[color][1] + 5];
  const coinXY = (color, i) => [TRAY[color][0] + 31.4 + i * 7.8, TRAY[color][1] + 5];
  const star = (r, ri, n = 5) => Array.from({ length: n * 2 }, (_, i) => { const a = -Math.PI / 2 + (i * Math.PI) / n, rr = i % 2 ? ri : r; return (Math.cos(a) * rr).toFixed(2) + ',' + (Math.sin(a) * rr).toFixed(2); }).join(' ');

  const DARKC = { blue: '#0b3a78', red: '#7a0f13', green: '#0a4a25', orange: '#8a4700' };
  const TOPC = { blue: '#3f98f0', red: '#f04a4f', green: '#33b762', orange: '#ffb23f' };
  const SOLD = { blue: '#2b86e6', red: '#e0292e', green: '#2fa65a', orange: '#f5b21a' };
  const rr = (x, y, w, h, a, b, c, d) => `M${x + a} ${y}H${x + w - b}Q${x + w} ${y} ${x + w} ${y + b}V${y + h - c}Q${x + w} ${y + h} ${x + w - c} ${y + h}H${x + d}Q${x} ${y + h} ${x} ${y + h - d}V${y + a}Q${x} ${y} ${x + a} ${y}Z`;
  const ARROW = 'M0 -2.9L2.8 0H1.1V2.9H-1.1V0H-2.8Z';
  // dice-style pip faces of the interior tiles (drawn for the top/blue quarter, then turned for the other three)
  const PIPS = { two: [[-2.3, -2.3], [2.3, 2.3]], ell: [[-2.3, -2.3], [2.3, -2.3], [-2.3, 2.3]], row: [[-3, 0], [0, 0], [3, 0]], four: [[-2.3, -2.3], [2.3, -2.3], [-2.3, 2.3], [2.3, 2.3]] };
  const BASE = [[1, 1, 'two'], [1, 2, 'two'], [1, 3, 'two'], [1, 4, 'two'], [1, 5, 'two'], [1, 6, 'two'], [1, 7, 'arrow'],
                [2, 2, 'ell'], [2, 3, 'row'], [2, 4, 'row'], [2, 5, 'row'], [2, 6, 'arrow'],
                [3, 3, 'four'], [3, 4, 'four'], [3, 5, 'arrow']];

  const tile = (c, r, color, radii) => `<path d="${rr(c * 10 + .5, r * 10 + .5, 9, 9, ...radii)}" fill="url(#t-${color})" stroke="${DARKC[color]}" stroke-width=".4"/>`;
  const pip = (x, y) => `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)})"><circle r="1.3" fill="#1c1604"/><circle r="1.02" fill="url(#gold)"/><polygon points="${star(.78, .32)}" fill="#fff3b0"/></g>`;
  const starTile = (cx, cy, color) => `<circle cx="${cx}" cy="${cy}" r="3.55" fill="url(#t-${color})" stroke="#0a0a0f" stroke-width=".6"/><polygon points="${star(2.95, 1.2)}" transform="translate(${cx} ${cy + .1})" fill="url(#gold)" stroke="#6d4300" stroke-width=".28" stroke-linejoin="round"/>`;
  const arrowGlyph = (cx, cy, region, owner) => `<path d="${ARROW}" transform="translate(${cx} ${cy}) rotate(${180 + 90 * region}) scale(.85)" fill="${HEX[owner]}" stroke="${DARKC[owner]}" stroke-width=".35" stroke-linejoin="round"/>`;
  const soldier = (cx, cy, color, side) => `<g transform="translate(${cx} ${cy}) rotate(${[180, 270, 0, 90][side]}) scale(.85) translate(-.6 .2)" fill="${SOLD[color]}">
      <path d="M-2.4 -2.7C-2.4 -4.6 -1.2 -5.2 .2 -5.2C1.8 -5.2 2.8 -4.4 2.8 -2.7Z"/><path d="M-3.2 -2.9H3.6L3.2 -2.2H-2.8Z"/>
      <ellipse cx=".2" cy="-.7" rx="1.6" ry="1.75"/><rect x="-.6" y=".6" width="1.6" height="1.2"/>
      <path d="M-3.6 5.2C-3.9 3 -3.8 1.6 -2.2 1L-.6 .5H1.2L2.7 1C4.1 1.6 4.2 3 3.9 5.2Z"/>
      <path d="M2.8 1.9L4.7 .3L3.5 -2" fill="none" stroke="${SOLD[color]}" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const CENTRE_FALLBACK = `<g transform="translate(50 50)"><circle r="5.2" fill="#fdb10a" stroke="#0a0a0a" stroke-width=".9"/><path d="M-3.6 -3.4Q-4.6 -.2 -2.4 2.6Q-1.2 4.2 -2.6 4.9L-4 3.6Q-5.3 -.5 -3.6 -3.4Z" fill="#d1d2d4"/><path d="M-.6 -4.9V-1.6Q.4 -2.5 1.4 -1.2Q3.2 1.8 2.2 4.8L.6 5Q1.4 2.4 -.2 -.4Q-1.2 -2 -.6 -4.9Z" fill="#d1d2d4"/></g>`;

  function boardSVG(players) {
    let h = `<defs>
      <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b96a33"/><stop offset="1" stop-color="#85441f"/></linearGradient>
      <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx=".8" cy=".9" r=".32" fill="#000" fill-opacity=".1"/><circle cx="2.3" cy="2.2" r=".26" fill="#fff" fill-opacity=".08"/></pattern>
      <radialGradient id="gold" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff2a6"/><stop offset=".5" stop-color="#f7c61e"/><stop offset="1" stop-color="#d28a00"/></radialGradient>
      <radialGradient id="ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
      ${E.COLORS.map((c) => `<linearGradient id="t-${c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${TOPC[c]}"/><stop offset="1" stop-color="${HEX[c]}"/></linearGradient>`).join('')}
    </defs>
    <rect x="-7" y="-7" width="114" height="116" rx="4.6" fill="url(#leather)" stroke="#4d2410" stroke-width=".6"/>
    <rect x="-7" y="-7" width="114" height="116" rx="4.6" fill="url(#grain)"/>
    <rect x="-6.3" y="-6.3" width="112.6" height="114.6" rx="4" fill="none" stroke="#e0a066" stroke-opacity=".5" stroke-width=".4"/>
    <rect x="-4.7" y="-4.7" width="109.4" height="111.6" rx="3" fill="none" stroke="#f6ecd9" stroke-width=".5" stroke-dasharray="1.7 1.1" stroke-linecap="round"/>
    <rect x="-2.4" y="-2.4" width="104.8" height="107.2" rx="2.2" fill="#f8f8f4" stroke="#3a2010" stroke-width=".5"/>
    <text x="101.8" y="103.2" text-anchor="end" font-size="1.9" font-weight="700" fill="#222">Country Of Origin Uganda</text>`;
    // outer ring: 4 sides x 9 tiles – home corner, three stars, soldier, three stars, arrow
    for (let k = 0; k < E.RING; k++) {
      const [c, r] = ringXY(k), side = Math.floor(k / E.SIDE), j = k % E.SIDE, col = E.COLORS[side], [cx, cy] = cellXY(c, r);
      if (j === 4) { h += `<path d="${rr(c * 10 + .5, r * 10 + .5, 9, 9, 1.5, 1.5, 1.5, 1.5)}" fill="#0e0e12" stroke="#000" stroke-width=".3"/>` + soldier(cx, cy, col, side); continue; }
      const rad = [1.5, 1.5, 1.5, 1.5];
      if (j === 0) rad[side] = 3.6;                               // home corner: big rounded outer corner
      h += tile(c, r, col, rad);
      h += j === E.SIDE - 1 ? arrowGlyph(cx, cy, side, E.COLORS[(side + 1) % 4]) : starTile(cx, cy, col);
    }
    // interior: four triangular quarters (pip faces + the arrow lane of the next colour)
    for (let i = 0; i < 4; i++) {
      const col = E.COLORS[i];
      BASE.forEach(([r0, c0, type]) => {
        const [r, c] = rotCell(r0, c0, i), [cx, cy] = cellXY(c, r);
        h += tile(c, r, col, [1.5, 1.5, 1.5, 1.5]);
        if (type === 'arrow') h += arrowGlyph(cx, cy, i, E.COLORS[(i + 1) % 4]);
        else PIPS[type].forEach((o) => { const [dx, dy] = rotOff(o, i); h += pip(cx + dx, cy + dy); });
      });
    }
    // centre: the RANKCO logo
    h += `<rect x="40.5" y="40.5" width="19" height="19" rx="2.6" fill="#fff" stroke="#111" stroke-width=".9"/>`;
    h += window.LOGO_OK === false ? CENTRE_FALLBACK : `<image href="logo.png" x="44" y="44" width="12" height="12" preserveAspectRatio="xMidYMid meet"/>`;
    // trays: waiting spots + the two recovery coins (3D tokens live in the HTML layer above the board)
    players.forEach((pl, pi) => {
      const [tx, ty] = TRAY[pl.color];
      h += `<rect x="${tx}" y="${ty}" width="${TRAY_W}" height="${TRAY_H}" rx="5" fill="rgba(6,6,12,.55)" stroke="${HEX[pl.color]}" stroke-width=".7"/>`;
      [0, 1].forEach((i) => {
        const [yx, yy] = yardXY(pl.color, i), [cx, cy] = coinXY(pl.color, i);
        h += `<circle cx="${yx}" cy="${yy}" r="4.3" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-opacity=".7" stroke-width=".45" stroke-dasharray="1.2 .9"/>
              <g id="cs-${pi}-${i}" transform="translate(${cx} ${cy})"><circle class="slot" r="3.4" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.55)" stroke-width=".4" stroke-dasharray=".9 .8" style="display:none"/>
              <g class="cu"><circle r="3.5" cx=".3" cy=".55" fill="rgba(0,0,0,.4)"/><use href="#rcoin" transform="scale(.068)"/></g></g>`;
      });
    });
    return h;
  }

  /* ---- 3D tokens (HTML/CSS-3D layer above the SVG board) ---- */
  const SNOW = `<svg class="snow" viewBox="-10 -10 20 20" aria-hidden="true"><g fill="none" stroke="#2f7fb2" stroke-width="1.5" stroke-linecap="round">${[0, 60, 120, 180, 240, 300].map((a) => `<g transform="rotate(${a})"><path d="M0 0V-8.6M0 -4.6L-2.4 -6.8M0 -4.6L2.4 -6.8"/></g>`).join('')}</g><circle r="1.5" fill="#e9f9ff" stroke="#2f7fb2" stroke-width=".8"/></svg>`;
  const EDGE = Array.from({ length: 9 }, (_, k) => `<i style="--z:${(-0.72 + k * 0.18).toFixed(2)};--b:${(0.5 + k * 0.055).toFixed(2)}"></i>`).join('');
  function tokensHTML(players) {
    return players.map((pl, pi) => pl.tokens.map((t, ti) => `<div class="tok" id="tok-${pi}-${ti}" data-pi="${pi}" data-ti="${ti}" style="--c:${HEX[pl.color]};--base:${HEX[pl.color]};--hi:${LIGHT[pl.color]};--lo:${DARKC[pl.color]}">
      <div class="sc"><div class="shadow"></div><div class="glow"></div><div class="halo"></div>
        <div class="stage"><div class="tilt"><div class="hop"><div class="flip"><div class="edge">${EDGE}</div>
          <div class="face fFront"><span class="rk"></span><b>${ti + 1}</b></div>
          <div class="face fBack">${SNOW}<b>${ti + 1}</b></div>
        </div></div></div></div>
        <div class="hit"></div></div></div>`).join('')).join('');
  }
  function fitBoard() {
    const w = $('#boardWrap').clientWidth;
    if (w) $('#boardWrap').style.setProperty('--u', (w / 118) + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe($('#boardWrap')); else window.addEventListener('resize', fitBoard);

  /* ---- token layout ---- */
  function layout() {
    const s = app.session.state, groups = {};
    s.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => {
      const v = app.view[pi + '-' + ti];
      if (v.p >= 0 && v.p < E.GOAL) { const k = E.tileOf(pl, v.p); (groups[k] = groups[k] || []).push(pi + '-' + ti); }
    }));
    s.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => {
      const key = pi + '-' + ti, v = app.view[key], n = cIdx(pl.color);
      let x, y, sc = 1;
      if (v.p < 0) [x, y] = yardXY(pl.color, ti);
      else if (v.p >= E.GOAL) { [x, y] = doneXY(n, ti); sc = .62; }
      else {
        const k = E.tileOf(pl, v.p), g = groups[k], idx = g.indexOf(key);
        [x, y] = tileCenter(k);
        if (g.length === 2) { x += (idx ? 1 : -1) * 2.2; sc = .82; }
        else if (g.length > 2) { x += (idx % 2 ? 1 : -1) * 2.1; y += (idx < 2 ? -1 : 1) * 1.7; sc = .66; }
      }
      const el = $('#tok-' + key);
      el.style.setProperty('--x', x); el.style.setProperty('--y', y); el.style.setProperty('--s', sc);
      const fz = v.frozen ? '1' : '0';
      if (el.dataset.fz !== undefined && el.dataset.fz !== fz) {       // freeze / unfreeze → hop + flip
        el.classList.remove('flipF', 'flipU'); void el.offsetWidth;
        el.classList.add(v.frozen ? 'flipF' : 'flipU');
        clearTimeout(el._ft); el._ft = setTimeout(() => el.classList.remove('flipF', 'flipU'), 1200);
      }
      el.dataset.fz = fz;
      el.classList.toggle('frozen', !!v.frozen);
      const lv = v.p >= 0 && v.p < E.GOAL ? E.levelOf(v.p) : 0;
      $('.rk', el).textContent = '★'.repeat(lv);
      el.style.zIndex = 5 + Math.max(0, v.p);
    }));
  }
  function syncView() {
    app.view = {};
    app.session.state.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => { app.view[pi + '-' + ti] = { p: t.p, frozen: t.frozen }; }));
  }
  function renderCoins() {
    const s = app.session.state;
    let pot = 0;
    s.players.forEach((pl, pi) => { pot += pl.spent; [0, 1].forEach((i) => {
      const c = $('#cs-' + pi + '-' + i), on = i < pl.coins;
      $('.cu', c).style.display = on ? '' : 'none'; $('.slot', c).style.display = on ? 'none' : '';
    }); });
    $('#potN').textContent = pot;
  }

  /* ===================================================================
     GAME – setup, rendering, loop
     =================================================================== */
  function startGame(again) {
    const mode = app.mode, s = ensureSetup(mode), seats = seatsOf(mode);
    const cfg = { players: seats.map((x) => ({ name: x.name, color: x.color, type: x.ai ? 'ai' : 'human', difficulty: x.ai ? s.difficulty : null })), startColor: s.first === 'random' ? null : s.first };
    app.session = { cfg, state: E.createGame(cfg) };
    app.log = []; app.busy = false; app.loop++;
    $('#board').innerHTML = boardSVG(app.session.state.players);
    $('#tokens').innerHTML = tokensHTML(app.session.state.players); fitBoard();
    $$('.tok', $('#tokens')).forEach((el) => el.addEventListener('click', onTokenClick));
    $('#log').innerHTML = '';
    syncView(); layout(); renderCoins(); renderAll(); renderDie(app.session.state.lastRoll || 0, true);
    go('game');
    pushLog(`Game on! ${esc(app.session.state.players[app.session.state.turn].name)} goes first.`);
    loop();
  }

  const nm = (pi) => `<span style="color:${LIGHT[app.session.state.players[pi].color]}">${esc(app.session.state.players[pi].name)}</span>`;
  function pushLog(html) { app.log.unshift(html); app.log.length = Math.min(app.log.length, 40); $('#log').innerHTML = app.log.slice(0, 8).map((l) => `<div>${l}</div>`).join(''); }

  function renderDie(v, quiet) {
    const pat = { 0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] }[v] || [];
    $('#die').innerHTML = Array.from({ length: 9 }, (_, i) => `<i class="${pat.includes(i) ? 'on' : ''}"></i>`).join('');
    $('#die').setAttribute('aria-label', v ? 'Dice shows ' + v : 'Dice');
  }
  async function rollDie(v) {
    const d = $('#die'); d.classList.add('rolling');
    for (let i = 0; i < 9; i++) { renderDie(1 + Math.floor(Math.random() * 6)); await sleep(55 + i * 8); }
    d.classList.remove('rolling'); renderDie(v);
  }
  function flash(text, color) {
    const f = document.createElement('div'); f.className = 'flash'; f.textContent = text; f.style.setProperty('--c', color || '#fff');
    $('#boardWrap').appendChild(f); setTimeout(() => f.remove(), 1200);
  }

  function renderAll() {
    const s = app.session.state;
    renderBanner(); renderPlayers(); renderCoins(); layout(); renderControls();
    if (s.lastRoll && !app.busy) renderDie(s.lastRoll);
  }

  function renderBanner() {
    const s = app.session.state, b = $('#turnBanner');
    if (s.phase === 'over') { b.style.setProperty('--c', HEX[s.players[s.winner].color]); b.innerHTML = `🏆 ${esc(s.players[s.winner].name)} wins!`; return; }
    const p = s.players[s.phase === 'setback' ? s.turn : s.turn];
    b.style.setProperty('--c', HEX[p.color]);
    b.innerHTML = `<span class="dot"></span>${esc(p.name)} · ${CNAME[p.color]}${s.bonus ? ' <em>BONUS ROLL</em>' : ''}`;
  }

  function renderPlayers() {
    const s = app.session.state;
    $('#players').innerHTML = s.players.map((pl, pi) => {
      const toks = pl.tokens.map((t, ti) => {
        if (t.p === E.GOAL) return `<span class="tk d">T${ti + 1} ✔ Centre</span>`;
        if (t.p < 0) return `<span class="tk">T${ti + 1} Waiting</span>`;
        return `<span class="tk${t.frozen ? ' f' : ''}">T${ti + 1} ${'★'.repeat(E.levelOf(t.p))} Round ${E.levelOf(t.p)}/${E.LAYERS}${t.frozen ? ' ❄' : ''}</span>`;
      }).join('');
      return `<div class="pl${pi === s.turn && s.phase !== 'over' ? ' me' : ''}" style="--c:${HEX[pl.color]}"><b>${esc(pl.name)}</b>
        <div class="coins" title="Recovery coins">${[0, 1].map((i) => i < pl.coins ? '<svg class="rc" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg>' : '<span class="rc off"></span>').join('')}</div>
        <span class="ty">${CNAME[pl.color]} · ${pl.type === 'ai' ? DIFF[pl.difficulty] + ' AI' : 'Human'}</span><div class="toks">${toks}</div></div>`;
    }).join('');
  }

  function optView(o, s) {
    const P = s.players[s.phase === 'setback' ? s.awaiting : s.turn], t = o.token !== undefined ? P.tokens[o.token] : null, v = s.roll;
    const T = t ? `Token ${t.id + 1}` : '';
    switch (o.type) {
      case 'move': { const to = Math.min(t.p + v, E.GOAL), up = to < E.GOAL && E.levelOf(to) > E.levelOf(t.p); return { i: '➜', a: `Promote ${T} by ${v}`, b: to >= E.GOAL ? 'Reaches the centre!' : `${'★'.repeat(E.levelOf(t.p))} → ${'★'.repeat(E.levelOf(to))}${up ? ' · next round' : ''}`, cls: 'good' }; }
      case 'enter': return { i: '⭐', a: `Bring ${T} into play`, b: 'Rolled a 6', cls: 'good' };
      case 'enter_pay': return { i: COIN, a: `Spend 1 coin: bring ${T} into play`, b: 'Skips this roll', cls: 'paid' };
      case 'unfreeze': return { i: '🔥', a: `Unfreeze ${T}`, b: 'Rolled a 6', cls: 'good' };
      case 'unfreeze_pay': return { i: COIN, a: `Spend 1 coin: unfreeze ${T}`, b: s.phase === 'roll' ? 'Then roll as normal' : 'Skips this roll', cls: 'paid' };
      case 'freeze': return { i: '❄', a: `Freeze ${T}`, b: `Rolled a 1 at ${'★'.repeat(E.levelOf(t.p))}`, cls: 'danger' };
      case 'recover': return { i: COIN, a: 'Reclaim a spent coin', b: 'Use your bonus roll to take one back from the pot', cls: 'good' };
      case 'pass': return { i: '⏭', a: 'Skip this roll', b: 'Keep your coins', cls: '' };
      case 'setback_pay': return { i: COIN, a: 'Pay 1 coin – hold your tile', b: `${T} stays where it is`, cls: 'paid' };
      case 'setback_accept': return { i: '⏪', a: 'Accept the setback', b: `${T} goes back 6 tiles`, cls: 'danger' };
    }
    return { i: '•', a: o.type, b: '', cls: '' };
  }

  function renderControls() {
    const s = app.session.state, box = $('#controls'), st = $('#status');
    $$('.tok').forEach((t) => t.classList.remove('can'));
    app.opts = [];
    if (s.phase === 'over') { box.innerHTML = ''; st.innerHTML = 'Game over'; return; }
    if (app.busy) { box.innerHTML = ''; return; }
    const actor = s.players[s.awaiting], mine = actor.type !== 'ai';
    const auto = E.autoAction(s);
    if (!mine || auto) {
      st.innerHTML = auto && mine ? `${esc(actor.name)}<small>${auto.type === 'freeze' ? 'No other move – token freezes.' : auto.type === 'pass' ? 'No legal move.' : 'Only one move available.'}</small>` : `${esc(actor.name)}<small>is playing…</small>`;
      box.innerHTML = `<div class="thinking"><span></span><span></span><span></span>${mine ? '' : ' Thinking…'}</div>`;
      return;
    }
    const opts = E.listOptions(s).map((o) => { const c = Object.assign({}, o); delete c.free0; return c; });
    app.opts = opts;
    if (s.phase === 'roll') {
      st.innerHTML = `${esc(actor.name)}'s turn<small>${s.bonus ? 'Bonus roll – you rolled a 6!' : 'Roll the dice.'}</small>`;
      box.innerHTML = `<button class="btn rollbtn" data-i="0">🎲 Roll dice</button>` + opts.slice(1).map((o, k) => optBtn(o, k + 1, s)).join('');
    } else if (s.phase === 'setback') {
      const pd = s.pending, by = s.players[pd.pi];
      st.innerHTML = `${esc(actor.name)}<small>Your decision</small>`;
      box.innerHTML = `<div class="alert">⚠ ${esc(by.name)} landed on your Token ${pd.victims[0].ti + 1}!</div>` + opts.map((o, k) => optBtn(o, k, s)).join('');
    } else {
      st.innerHTML = `${esc(actor.name)} rolled a ${s.roll}<small>${s.bonus ? 'Bonus roll · ' : ''}Choose what to do – or tap a glowing token.</small>`;
      box.innerHTML = opts.map((o, k) => optBtn(o, k, s)).join('');
      opts.forEach((o) => { if (!o.paid && ['move', 'enter', 'unfreeze'].includes(o.type)) $('#tok-' + s.awaiting + '-' + o.token).classList.add('can'); });
    }
    $$('[data-i]', box).forEach((b) => b.onclick = () => dispatch(app.opts[+b.dataset.i]));
  }
  function optBtn(o, i, s) { const v = optView(o, s); return `<button class="opt ${v.cls}" data-i="${i}"><span class="i">${v.i}</span><span>${v.a}<small>${v.b}</small></span></button>`; }

  function onTokenClick(e) {
    if (app.busy) return;
    const el = e.currentTarget, s = app.session.state;
    if (+el.dataset.pi !== s.awaiting) return;
    const o = app.opts.find((x) => !x.paid && x.token === +el.dataset.ti && ['move', 'enter', 'unfreeze'].includes(x.type));
    if (o && s.phase === 'act') dispatch(o);
  }

  /* ---- the single input path: human click, AI, (later) network ---- */
  async function dispatch(action) {
    if (app.busy || !app.session) return;
    const my = app.loop, prev = app.session.state;
    const res = E.apply(prev, action);
    if (res.error) { console.warn(res); return; }
    app.busy = true; app.session.state = res.state; renderControls();
    await animate(res.events);
    if (my !== app.loop) return;
    app.busy = false; syncView(); renderAll(); loop();
  }

  async function loop() {
    const my = app.loop, s = app.session.state;
    if (s.phase === 'over') { await sleep(1300); if (my === app.loop) showResults(); return; }
    const actor = s.players[s.awaiting], auto = E.autoAction(s);
    if (auto) { await sleep(actor.type === 'ai' ? 650 : 1000); if (my === app.loop) dispatch(auto); return; }
    if (actor.type === 'ai') { await sleep(800); if (my === app.loop) dispatch(AI.choose(s, actor.difficulty)); }
  }

  async function animate(events) {
    const name = (pi) => nm(pi);
    for (const e of events) {
      const key = e.pi + '-' + e.ti, col = e.pi !== undefined ? HEX[app.session.state.players[e.pi].color] : '#fff';
      switch (e.t) {
        case 'roll': await rollDie(e.value); pushLog(`${name(e.pi)} rolled a <b>${e.value}</b>${e.bonus ? ' (bonus)' : ''}`); await sleep(280); break;
        case 'enter': app.view[key].p = 0; layout(); pushLog(`${name(e.pi)} brought Token ${e.ti + 1} into play${e.paid ? ' (1 coin)' : ''}`); await sleep(450); break;
        case 'move': {
          for (const p of e.path) {
            app.view[key].p = p; layout();
            if (p > 0 && E.isHome(p)) flash('★'.repeat(E.levelOf(p)) + ' ROUND ' + E.levelOf(p), col);
            await sleep(e.path.length > 3 ? 120 : 160);
          }
          const up = E.levelOf(e.to) > E.levelOf(e.from) && e.to < E.GOAL;
          pushLog(`${name(e.pi)} promoted Token ${e.ti + 1} by ${e.steps}${up ? ` → <b>${'★'.repeat(E.levelOf(e.to))}</b> (round ${E.levelOf(e.to)})` : ''}`);
          await sleep(200); break;
        }
        case 'salute': pushLog(`🫡 ${name(e.owner)} salutes ${name(e.pi)} – <b>+3 bonus moves</b>`); flash('🫡 Salute! +3', col); await sleep(950); break;
        case 'setback': {
          flash('SETBACK!', col); await sleep(380);
          for (const p of e.path.slice(1)) { app.view[key].p = p; layout(); await sleep(430); }
          pushLog(`⏪ ${name(e.pi)}'s Token ${e.ti + 1} ${e.to < 0 ? 'sent back off the board' : 'pushed back ' + (e.from - e.to) + ' tiles'} by ${name(e.by)}`); await sleep(250); break;
        }
        case 'hold': flash('HELD!', col); pushLog(`${COINI} ${name(e.pi)} paid a coin – Token ${e.ti + 1} holds its tile`); await sleep(700); break;
        case 'coin': renderCoinsLive(e.pi); await sleep(250); break;
        case 'freeze': app.view[key].frozen = true; layout(); flash('❄ FROZEN', '#8fd3ff'); pushLog(`❄ ${name(e.pi)}'s Token ${e.ti + 1} is frozen`); await sleep(1150); break;
        case 'unfreeze': app.view[key].frozen = false; layout(); flash('UNFROZEN', '#6ff0a0'); pushLog(`🔥 ${name(e.pi)} unfroze Token ${e.ti + 1}${e.paid ? ' (1 coin)' : ''}`); await sleep(1050); break;
        case 'recover': pushLog(`${COINI} ${name(e.pi)} reclaimed a coin from the pot`); await sleep(500); break;
        case 'pass': pushLog(`${name(e.pi)} could not move`); await sleep(350); break;
        case 'finish': app.view[key].p = E.GOAL; layout(); flash('🏅 REACHED THE CENTRE', col); pushLog(`🏅 ${name(e.pi)}'s Token ${e.ti + 1} reached the centre!`); await sleep(1000); break;
        case 'bonus': flash('🎲 BONUS ROLL', col); await sleep(500); break;
        case 'win': pushLog(`🏆 <b>${name(e.pi)} wins!</b>`); break;
      }
    }
  }
  function renderCoinsLive(pi) { const s = app.session.state; renderCoins(); }

  /* ---- leaving / rules ---- */
  function modal(html, acts) {
    const m = $('#modal');
    m.innerHTML = `<div class="sheet glass">${html}<div class="acts">${acts.map((a, i) => `<button class="btn ${a.dark ? 'dark' : ''}" data-k="${i}">${a.label}</button>`).join('')}</div></div>`;
    m.classList.remove('hidden');
    $$('[data-k]', m).forEach((b) => b.onclick = () => { m.classList.add('hidden'); const f = acts[+b.dataset.k].fn; if (f) f(); });
  }
  $('#gBack').onclick = () => modal('<h3>Leave this game?</h3><p>The current match will be lost. Your player setup is kept so you can start again.</p>',
    [{ label: 'Keep playing', dark: true }, { label: 'Leave game', fn: () => { app.loop++; app.busy = false; renderSetup(); go('setup'); } }]);
  $('#gRules').onclick = () => modal(`<h3>RANKCO rules</h3><ul>
    <li><b>Goal:</b> be first to bring <b>both</b> tokens through <b>4 rounds</b> – one on each layer of the board – and into the centre.</li>
    <li><b>Enter:</b> roll a 6 to bring a token in – or spend 1 coin if you miss.</li>
    <li><b>Move:</b> roll and promote a token clockwise. Each round is played on its own layer, working inwards: round 1 on the outer ring (★), round 2 on the next ring (★★), round 3 (★★★), round 4 on the inner ring (★★★★). Each round ends on an arrow in your colour – it leads you into the next layer’s home corner, and the last arrow leads into the centre. Your own tokens can’t skip each other.</li>
    <li><b>Setbacks:</b> land on an opponent and their token goes back 6 tiles (repeating if that tile is taken). They can pay 1 coin to stay put.</li>
    <li><b>Salutation tile:</b> land on another colour’s soldier tile for 3 bonus moves.</li>
    <li><b>Rolling a 6</b> earns a bonus roll. On a bonus roll you may instead reclaim a spent coin.</li>
    <li><b>Freeze:</b> rolling a 1 with a token in round 3 or 4 (★★★ / ★★★★) freezes it – the token flips over to show its ice face. Frozen tokens can’t move or be set back. Unfreeze with a 6 or 1 coin. With a lower token in play you may promote that one instead.</li>
    <li><b>Home corners</b> are safe from setbacks and freezing.</li></ul>`, [{ label: 'Got it' }]);

  /* ===================================================================
     SCREEN 5 – results
     =================================================================== */
  function showResults() {
    const s = app.session.state, rank = E.ranking(s), w = s.players[s.winner];
    $('#resultsRoot').innerHTML = `
      <div style="padding-top:18px"><div class="trophy">🏆</div>
      <div class="winner" style="--c:${HEX[w.color]}"><span>${esc(w.name)}</span> wins!</div>
      <p class="sub" style="margin-top:6px">Both ${CNAME[w.color]} tokens reached the centre in ${s.turnCount + 1} turns.</p></div>
      <div class="table glass">${rank.map((pl, i) => `<div class="r" style="--c:${HEX[pl.color]}"><div class="pos">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
        <div class="nm"><i></i>${esc(pl.name)}<small>${pl.stats.rolls} rolls · ${pl.stats.setbacksGiven} setbacks dealt · ${pl.stats.setbacksTaken} taken · ${pl.stats.salutes} salutes · ${pl.stats.coinsSpent} coins used</small></div>
        <div class="pr">${pl.tokens.filter((t) => t.p === E.GOAL).length}/2 home</div></div>`).join('')}</div>
      <div class="res-actions"><button class="btn" id="again">Play again</button><button class="btn dark" id="chSetup">Change setup</button><button class="btn dark" id="toModes">Game modes</button></div>`;
    $('#again').onclick = () => startGame(true);
    $('#chSetup').onclick = () => { renderSetup(); go('setup'); };
    $('#toModes').onclick = () => { renderModes(); go('modes'); };
    go('results'); confetti();
  }
  function confetti() {
    const cols = Object.values(HEX).concat(['#f5a91a', '#fff']);
    for (let i = 0; i < 70; i++) {
      const c = document.createElement('div'); c.className = 'confetti';
      c.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % cols.length]};animation-duration:${2.4 + Math.random() * 2.4}s;animation-delay:${Math.random() * .8}s;transform:rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(c); setTimeout(() => c.remove(), 6500);
    }
  }

  /* ---- boot ---- */
  buildOrbit();
  (function buildSparks() {                                  // drifting gold sparks on page 2
    let h = '';
    for (let i = 0; i < 26; i++) {
      const sz = 3 + Math.random() * 6;
      h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;--dx:${(Math.random() * 80 - 40).toFixed(0)}px;animation-duration:${(7 + Math.random() * 9).toFixed(1)}s;animation-delay:${(Math.random() * 9).toFixed(1)}s"></i>`;
    }
    $('#sparks').innerHTML = h;
  })();
  /* landing page: after 3 seconds it leaves by itself and page 2 (the board behind the title) appears */
  setTimeout(() => {
    if (app.screen !== 'splash') return;
    $('#bgBoard').innerHTML = boardSVG([]);                  // the real board artwork, no tokens
    go('welcome');
  }, 3000);
  window.RANKCO = { E, AI, app };   // handy for future online adapters / debugging
})();

</script>
</body>
</html>
