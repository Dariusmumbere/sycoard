<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RANKCO – Strategy. Luck. Decision Making. Risk Management.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2b7de9; --red:#e0292e; --green:#1e9e4a; --orange:#f39419;
  --gold:#f5a91a; --lav:#b8a9ee; --edge:#e58a2f; --ink:#fff;
  --bg-a:#3b4156; --bg-b:#1a1d29; --bg-c:#08090e;
  --card:radial-gradient(130% 100% at 88% -8%,rgba(196,181,248,.95) 0%,rgba(132,112,206,.58) 26%,rgba(62,52,104,.26) 48%,transparent 68%),linear-gradient(168deg,#272a3b 0%,#0d0e16 68%,#050508 100%);
  --pill:linear-gradient(100deg,#03030a 0%,#06060d 16%,#7d6fb8 52%,#06060d 84%,#000 100%);
  --btn:linear-gradient(135deg,#d6cafc 0%,#9a86e6 48%,#5d47b6 100%);
  font-family:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg-c);color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
#app{position:fixed;inset:0;overflow:hidden;overflow:clip;background:radial-gradient(120% 80% at 50% 0%,var(--bg-a) 0%,var(--bg-b) 48%,var(--bg-c) 100%);overflow:hidden}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .45s ease,transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s;transform:translateX(5%)}
.screen.before{transform:translateX(-5%)}
.screen.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.wrap{width:min(100%,980px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 40px}

.pill-title{display:block;text-align:center;font-weight:800;font-size:clamp(20px,4.6vw,30px);letter-spacing:.04em;text-transform:uppercase;
  padding:18px 26px;border-radius:999px;background:var(--pill);border:1.5px solid var(--edge);box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18)}
.sub{text-align:center;font-weight:500;font-size:clamp(15px,3.6vw,19px);color:#d8d6e8;margin:18px 0 22px;letter-spacing:.01em}
.glass{background:var(--card);border:1px solid rgba(255,255,255,.72);border-radius:28px;box-shadow:0 12px 34px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;
  padding:15px 30px;background:var(--btn);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 22px rgba(60,40,140,.55),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .18s,box-shadow .18s,filter .18s;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:0 12px 28px rgba(90,60,200,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.dark{background:linear-gradient(160deg,#2c2f42,#0b0b12);border-color:rgba(255,255,255,.45);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:10px 18px 10px 14px;margin-bottom:14px;
  border-radius:999px;background:rgba(10,10,18,.65);border:1px solid rgba(255,255,255,.4);transition:.18s}
.back:hover{background:rgba(120,100,200,.35);transform:translateX(-2px)}

/* ---------- SCREEN 1 : welcome ---------- */
#s-welcome{display:flex;align-items:center;justify-content:center;background:
  radial-gradient(60% 45% at 18% 12%,rgba(43,125,233,.22),transparent 70%),radial-gradient(60% 45% at 86% 14%,rgba(224,41,46,.2),transparent 70%),
  radial-gradient(60% 45% at 86% 90%,rgba(30,158,74,.2),transparent 70%),radial-gradient(60% 45% at 14% 88%,rgba(243,148,25,.2),transparent 70%)}
.orbit{position:absolute;left:50%;top:50%;width:min(130vw,118vh,900px);aspect-ratio:1;translate:-50% -50%;opacity:.9;pointer-events:none}
.orbit svg{width:100%;height:100%;animation:spin 90s linear infinite}
.orbit rect{opacity:.22;animation:chase 4.8s ease-in-out infinite}
@keyframes chase{0%,100%{opacity:.16}8%{opacity:1}22%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.welcome-center{position:relative;z-index:2;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vh,26px)}
.emblem{width:clamp(84px,18vw,118px);animation:rise 1s .05s cubic-bezier(.2,.9,.2,1) both,float 5s 1.2s ease-in-out infinite}
.logo-img{display:block;width:clamp(220px,62vw,520px);max-height:46vh;height:auto;object-fit:contain;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(124,92,255,.35));
  animation:rise 1s .05s cubic-bezier(.2,.9,.2,1) both,float 5s 1.2s ease-in-out infinite}
.wordmark{display:flex;font-family:'Orbitron','Montserrat',sans-serif;font-weight:900;font-size:clamp(46px,13.5vw,118px);line-height:1;letter-spacing:.03em;font-style:italic;transform:skewX(-6deg)}
.wordmark span{display:inline-block;color:#fff;-webkit-text-stroke:3px #5a3fd0;paint-order:stroke fill;text-shadow:0 0 18px rgba(124,92,255,.85),0 0 46px rgba(91,63,209,.65);
  animation:letter .9s cubic-bezier(.2,.9,.2,1) both}
.wordmark span:nth-child(1){animation-delay:.25s}.wordmark span:nth-child(2){animation-delay:.34s}.wordmark span:nth-child(3){animation-delay:.43s}
.wordmark span:nth-child(4){animation-delay:.52s}.wordmark span:nth-child(5){animation-delay:.61s}.wordmark span:nth-child(6){animation-delay:.70s}
.slogan{font-weight:600;font-size:clamp(13px,3.3vw,19px);letter-spacing:.08em;color:#dcdaf0;max-width:30em;line-height:1.7;animation:rise .9s 1s both}
.slogan b{font-weight:800;white-space:nowrap}
.slogan .c1{color:#6fb0ff}.slogan .c2{color:#ff6b6f}.slogan .c3{color:#4fd982}.slogan .c4{color:#ffb54a}
.play{font-size:clamp(18px,4.6vw,24px);padding:20px 58px;animation:rise .9s 1.25s both,glow 2.8s 2.2s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes letter{from{opacity:0;transform:translateY(40px) rotate(6deg);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(154,134,230,.16),0 12px 40px rgba(110,80,230,.8),inset 0 1px 0 rgba(255,255,255,.5)}}

/* ---------- SCREEN 0 : landing (logo + Sycoard Games) ---------- */
#s-splash{display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 50% at 50% 44%,rgba(124,92,255,.3),transparent 70%),radial-gradient(120% 80% at 50% 0%,#2b2f46 0%,#12131c 55%,#06070b 100%)}
.sp-halo{position:absolute;left:50%;top:44%;width:min(125vw,760px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;opacity:.55;filter:blur(64px);pointer-events:none;
  background:conic-gradient(from 0deg,rgba(43,125,233,0),rgba(43,125,233,.6),rgba(224,41,46,0),rgba(224,41,46,.6),rgba(30,158,74,0),rgba(30,158,74,.6),rgba(243,148,25,0),rgba(243,148,25,.6),rgba(43,125,233,0));animation:spin 12s linear infinite}
.sp-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:30px;padding:24px;text-align:center}
.sp-logo{display:flex;flex-direction:column;align-items:center;position:relative}
.sp-brand{display:flex;align-items:center;gap:clamp(12px,3vw,22px);animation:rise 1s .7s both}
.sp-brand b{font-weight:800;font-size:clamp(14px,4.2vw,24px);letter-spacing:.42em;padding-left:.42em;white-space:nowrap;
  background:linear-gradient(100deg,#e08a12 0%,#fff3b8 30%,#f7c948 50%,#e08a12 80%,#fff3b8 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(245,169,26,.45));animation:shimmer 4s linear infinite}
.sp-line{height:1.5px;width:clamp(28px,11vw,96px);animation:lineGrow 1s 1s both}
.sp-line.l{background:linear-gradient(90deg,transparent,#f5a91a);transform-origin:right}
.sp-line.r{background:linear-gradient(270deg,transparent,#f5a91a);transform-origin:left}
@keyframes lineGrow{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes shimmer{to{background-position:-250% 0}}

/* ---------- SCREEN 1 : RANKCO GAME over the board ---------- */
.bgboard{position:absolute;inset:0;padding-bottom:var(--lift,7%);display:grid;place-items:center;perspective:1700px;overflow:hidden;pointer-events:none}
.bgb-tilt{--W:min(64vw,82vh,900px);--u:calc(var(--W) / 118);--rx:52deg;--rz:-30deg;position:relative;width:var(--W);transform-style:preserve-3d;
  transform:rotateX(var(--rx)) rotateZ(var(--rz));animation:bgDrift 26s ease-in-out infinite alternate}
.bgb-tilt>svg{opacity:.7;filter:saturate(1.2) brightness(.92) drop-shadow(0 40px 60px rgba(0,0,0,.7))}
@media (max-aspect-ratio:4/5){.bgb-tilt{--W:min(78vw,60vh,880px);--rx:44deg;--rz:-10deg}.bgboard{padding-bottom:40%}#s-welcome .welcome-center{transform:translateY(13vh)}}
.bgb-tilt svg{display:block;width:100%;height:auto}
@keyframes bgDrift{from{transform:rotateX(calc(var(--rx) - 3deg)) rotateZ(calc(var(--rz) - 5deg)) translateY(-1%)}to{transform:rotateX(calc(var(--rx) + 3deg)) rotateZ(calc(var(--rz) + 6deg)) translateY(1%)}}
.bg-veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(46% 34% at 50% 58%,rgba(6,7,12,.7),rgba(6,7,12,.3) 62%,transparent 100%),linear-gradient(180deg,rgba(6,7,12,.55),transparent 22%,transparent 80%,rgba(6,7,12,.7))}
#s-welcome .slogan{text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8)}
#s-welcome .orbit{opacity:.5;z-index:1}
.sparks{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.sparks i{position:absolute;bottom:-14px;border-radius:50%;background:radial-gradient(circle,#fff6c4 0%,#f7c948 45%,transparent 70%);opacity:0;animation:spark linear infinite}
@keyframes spark{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translateY(-105vh) translateX(var(--dx,0px)) scale(1.2);opacity:0}}
.title-rk{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vw,16px);line-height:1;animation:rise 1s .1s cubic-bezier(.2,.9,.2,1) both}
.title-rk .t1{display:block;font-family:'Orbitron','Montserrat',sans-serif;font-weight:900;font-style:italic;font-size:clamp(46px,min(15.5vw,17vh),138px);letter-spacing:.04em;transform:skewX(-6deg);
  background:linear-gradient(100deg,#d9820f 0%,#fff3b8 18%,#f7c948 36%,#e08a12 54%,#fff3b8 72%,#d9820f 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(124,92,255,.9)) drop-shadow(0 5px 0 rgba(58,30,140,.85)) drop-shadow(0 14px 24px rgba(0,0,0,.6));animation:shimmer 6s linear infinite}
.title-rk .t2{display:flex;align-items:center;gap:clamp(8px,2.4vw,18px)}
.title-rk .t2 em{font-style:normal;font-weight:800;font-size:clamp(18px,5.6vw,40px);letter-spacing:.62em;padding-left:.62em;color:#efeaff;text-shadow:0 0 18px rgba(154,134,230,.9),0 2px 6px rgba(0,0,0,.6)}
.title-rk .t2 i{width:clamp(8px,2vw,13px);aspect-ratio:1;transform:rotate(45deg);border-radius:3px;box-shadow:0 0 14px currentColor;animation:pulse 1.8s ease-in-out infinite}
.title-rk .t2 .d1{color:#2b7de9;background:#2b7de9}.title-rk .t2 .d2{color:#e0292e;background:#e0292e;animation-delay:.2s}
.title-rk .t2 .d3{color:#1e9e4a;background:#1e9e4a;animation-delay:.4s}.title-rk .t2 .d4{color:#f39419;background:#f39419;animation-delay:.6s}
@media (prefers-reduced-motion:reduce){.bgb-tilt{animation:none}}

/* ---------- SCREEN 2 : game modes ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2.6vw,22px)}
.mode{position:relative;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(200px,22vw,245px);padding:20px;border-radius:30px;overflow:hidden;
  border:1px solid rgba(255,255,255,.55);background:var(--g),linear-gradient(165deg,#222536 0%,#0c0d14 100%);
  box-shadow:0 12px 30px rgba(0,0,0,.55);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;
  animation:rise .7s both}
.mode:nth-child(1){--a:var(--blue);--g:radial-gradient(90% 70% at 85% 0%,rgba(190,185,255,.8),transparent 62%);animation-delay:.05s}
.mode:nth-child(2){--a:var(--red);--g:radial-gradient(90% 70% at 10% 100%,rgba(255,170,170,.5),transparent 60%),radial-gradient(70% 55% at 85% 0%,rgba(190,185,255,.55),transparent 62%);animation-delay:.12s}
.mode:nth-child(3){--a:var(--green);--g:radial-gradient(90% 70% at 90% 0%,rgba(190,255,215,.5),transparent 62%),radial-gradient(70% 55% at 0% 80%,rgba(190,185,255,.5),transparent 62%);animation-delay:.19s}
.mode:nth-child(4){--a:var(--orange);--g:radial-gradient(90% 70% at 50% 0%,rgba(255,215,160,.5),transparent 62%),radial-gradient(70% 55% at 100% 100%,rgba(190,185,255,.5),transparent 62%);animation-delay:.26s}
.mode::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--a);box-shadow:0 0 22px var(--a)}
.mode:hover,.mode:focus-visible{transform:translateY(-6px) scale(1.015);border-color:var(--a);box-shadow:0 18px 42px rgba(0,0,0,.6),0 0 0 1px var(--a),0 0 34px color-mix(in srgb,var(--a) 55%,transparent);outline:none}
.mode:active{transform:scale(.985)}
.mode .ico{font-size:clamp(46px,9vw,76px);line-height:1;margin-bottom:auto;padding-top:14px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));transition:transform .3s}
.mode:hover .ico{transform:scale(1.12) rotate(-4deg)}
.mode h3{font-size:clamp(18px,3.8vw,28px);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-top:10px}
.mode p{font-size:clamp(11.5px,2.5vw,14px);font-weight:500;color:#d6d3ea;margin-top:6px;line-height:1.45}
.mode .tag{margin-top:10px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--a);filter:brightness(1.5)}
.mode .check{position:absolute;right:14px;top:20px;width:34px;height:34px;border-radius:50%;background:var(--a);display:grid;place-items:center;font-weight:900;
  transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1);box-shadow:0 0 18px var(--a)}
.mode.selected{border-color:#fff;box-shadow:0 0 0 2px var(--a),0 0 40px color-mix(in srgb,var(--a) 65%,transparent),0 16px 40px rgba(0,0,0,.6);transform:translateY(-4px) scale(1.02)}
.mode.selected .check{transform:scale(1)}
@media (max-width:360px){.modes{grid-template-columns:1fr}}

/* ---------- SCREEN 3 : setup ---------- */
.mode-chip{display:flex;align-items:center;gap:14px;padding:14px 18px;margin-bottom:16px;border-radius:24px;background:rgba(8,8,14,.7);border:1px solid rgba(255,255,255,.35)}
.mode-chip .ico{font-size:34px}
.mode-chip small{display:block;font-size:11px;letter-spacing:.14em;color:#b9b6d4;font-weight:700}
.mode-chip b{font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.mode-chip .btn{margin-left:auto;padding:9px 16px;font-size:12px}
.setup-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
@media (max-width:820px){.setup-grid{grid-template-columns:1fr}}
.form,.summary{padding:22px}
.row{margin-bottom:20px}.row:last-child{margin-bottom:0}
.row>label,.lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#e9e5ff;margin-bottom:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:12px 14px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase;border-radius:16px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);transition:.18s}
.seg button:hover{border-color:#fff}
.seg button.on{background:var(--btn);border-color:#fff;box-shadow:0 0 18px rgba(154,134,230,.7)}
.seg button .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.seat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px;margin-bottom:12px;border-radius:20px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);border-left:6px solid var(--c)}
.seat .num{font-weight:900;font-size:22px;opacity:.9;width:30px;text-align:center}
.seat .name{width:100%;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:700;font-size:16px;outline:none;transition:.18s}
.seat .name:focus{border-color:#fff;background:rgba(255,255,255,.15);box-shadow:0 0 0 3px rgba(154,134,230,.5)}
.seat .ai-name{font-weight:800;font-size:16px;padding:12px 0}.seat .ai-name small{display:block;font-size:11px;letter-spacing:.12em;color:#c9c5e6}
.swatches{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:14px;background:var(--c);border:2px solid rgba(255,255,255,.35);position:relative;transition:transform .18s,box-shadow .18s;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 8px rgba(255,255,255,.3)}
.sw:hover{transform:translateY(-3px) scale(1.06)}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 0 18px var(--c)}
.sw.on::after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.sum-list{list-style:none}
.sum-list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14);font-weight:700}
.sum-list li:last-child{border:0}
.sum-list .c{width:16px;height:16px;border-radius:5px;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
.sum-list .t{margin-left:auto;font-size:11px;letter-spacing:.1em;color:#d0cdea;text-transform:uppercase;text-align:right}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.fact{padding:12px;border-radius:16px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.2)}
.fact small{display:block;font-size:10.5px;letter-spacing:.12em;color:#c3bfe0;font-weight:700;text-transform:uppercase}
.fact b{font-size:15px;text-transform:uppercase}
.start{width:100%;font-size:20px;padding:19px}

/* ---------- SCREEN 4 : game ---------- */
#s-game{overflow:hidden}
.g-top{display:flex;align-items:center;justify-content:space-between;padding:max(10px,env(safe-area-inset-top)) 14px 8px;gap:10px}
.g-top .back{margin:0}
.g-title{font-family:'Orbitron',sans-serif;font-weight:900;font-style:italic;letter-spacing:.06em;font-size:20px;-webkit-text-stroke:1.5px #5a3fd0;paint-order:stroke fill;text-shadow:0 0 14px rgba(124,92,255,.8)}
.g-body{position:absolute;inset:56px 0 0;overflow-y:auto;padding:0 14px 28px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-content:start;max-width:1180px;margin:0 auto;left:0;right:0}
@media (max-width:900px){.g-body{grid-template-columns:1fr}}
.turn-banner{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 18px;margin-bottom:12px;border-radius:999px;background:var(--pill);border:1.5px solid var(--c,var(--edge));box-shadow:0 0 22px color-mix(in srgb,var(--c,transparent) 45%,transparent),0 8px 20px rgba(0,0,0,.5);
  font-weight:800;letter-spacing:.05em;text-transform:uppercase;font-size:clamp(13px,3.4vw,17px);transition:border-color .4s,box-shadow .4s}
.turn-banner .dot{width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);animation:pulse 1.4s infinite}
.turn-banner em{font-style:normal;font-size:11px;padding:3px 10px;border-radius:99px;background:var(--gold);color:#241500;letter-spacing:.1em}
@keyframes pulse{50%{transform:scale(1.3)}}
.play-col{width:min(100%,max(300px,calc((100dvh - 290px) * .819)),680px);margin:0 auto}
@media (max-width:900px){.play-col{width:min(100%,680px)}}
.board-wrap{position:relative;width:100%}
#board{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}

/* ---- 3D tokens: real CSS-3D pieces (stacked rim + two faces) floating above the board ---- */
.tokens{position:absolute;inset:0;pointer-events:none;isolation:isolate}
.tok{--rad:18%;--d:calc(var(--u,5px) * 7.4);--edge:var(--base);position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;
  transform:translate(calc((var(--x,0) + 9) * var(--u,5px)),calc((var(--y,0) + 21) * var(--u,5px)));
  transition:transform .16s cubic-bezier(.3,.9,.4,1)}
.tok.frozen{--edge:#9fd9f2}
.tok .sc{position:absolute;left:0;top:0;width:0;height:0;transform:scale(var(--s,1));transition:transform .2s}
.tok .stage,.tok .shadow,.tok .glow,.tok .hit,.tok .halo{position:absolute;width:var(--d);height:var(--d);left:calc(var(--d) / -2);top:calc(var(--d) / -2);border-radius:var(--rad)}
.tok .shadow{left:calc(var(--d) / -2 + var(--u,5px) * .5);top:calc(var(--d) / -2 + var(--u,5px) * 1.3);background:rgba(0,0,0,.5);filter:blur(calc(var(--u,5px) * .7));transition:background .5s}
.tok.frozen .shadow{background:rgba(40,110,170,.55)}
.tok .glow{opacity:0;box-shadow:0 0 calc(var(--u,5px) * 2.6) calc(var(--u,5px) * .7) rgba(143,211,255,.95);transition:opacity .5s}
.tok.frozen .glow{opacity:.85;animation:iceGlow 1.8s ease-in-out infinite alternate}
@keyframes iceGlow{from{opacity:.45}to{opacity:.95}}
.tok .stage{perspective:calc(var(--u,5px) * 46)}
.tok .tilt,.tok .hop,.tok .flip,.tok .edge{position:absolute;inset:0;transform-style:preserve-3d}
.tok .tilt{transform:rotateX(22deg)}
.tok .flip{transform:rotateY(0deg)}
.tok.frozen .flip{transform:rotateY(180deg)}
.tok .edge i{position:absolute;inset:0;border-radius:var(--rad);background-color:var(--edge);filter:brightness(var(--b,1));
  transform:translateZ(calc(var(--u,5px) * var(--z,0)));transition:background-color .6s}
.tok .face{position:absolute;inset:0;border-radius:var(--rad);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:'Montserrat',system-ui,sans-serif}
.tok .fFront{transform:translateZ(calc(var(--u,5px) * .62));
  background:radial-gradient(circle at 34% 28%,var(--hi) 0,var(--c) 46%,var(--lo) 100%);
  box-shadow:inset 0 0 0 calc(var(--u,5px) * .18) rgba(255,255,255,.5),inset 0 calc(var(--u,5px) * -.35) calc(var(--u,5px) * .7) calc(var(--u,5px) * .35) rgba(0,0,0,.3)}
.tok .fFront::before{content:"";position:absolute;left:15%;top:8%;width:46%;height:28%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));transform:rotate(-22deg)}
.tok .fFront b{position:relative;top:calc(var(--u,5px) * .45);font-weight:900;font-size:calc(var(--u,5px) * 3.5);line-height:1;color:#fff;
  text-shadow:0 calc(var(--u,5px) * .14) 0 rgba(0,0,0,.5),0 0 calc(var(--u,5px) * .5) rgba(0,0,0,.25)}
.tok .rk{position:absolute;top:calc(var(--u,5px) * .72);left:0;right:0;text-align:center;font-size:calc(var(--u,5px) * 1.2);line-height:1;letter-spacing:calc(var(--u,5px) * .02);color:#ffd34d;text-shadow:0 0 calc(var(--u,5px) * .25) #5a3b00,0 calc(var(--u,5px) * .08) 0 #5a3b00;white-space:nowrap}
.tok .fBack{transform:rotateY(180deg) translateZ(calc(var(--u,5px) * .62));overflow:hidden;
  background:radial-gradient(circle at 34% 28%,#fff 0,#d7f1ff 30%,#86cdf0 68%,#3f8cc0 100%);
  box-shadow:inset 0 0 0 calc(var(--u,5px) * .2) #fff,inset 0 0 0 calc(var(--u,5px) * .52) #5fb0dc,inset 0 0 calc(var(--u,5px) * .9) rgba(30,100,160,.45)}
.tok .fBack .snow{position:absolute;left:calc(50% - var(--u,5px) * 1.65);top:calc(50% - var(--u,5px) * 3.35);width:calc(var(--u,5px) * 3.3);height:calc(var(--u,5px) * 3.3);filter:drop-shadow(0 0 calc(var(--u,5px) * .35) #fff)}
.tok .fBack .fz{position:absolute;left:0;right:0;bottom:calc(var(--u,5px) * 1.85);text-align:center;font-weight:900;font-size:calc(var(--u,5px) * 1.25);letter-spacing:.03em;line-height:1;color:#0c4571;text-shadow:0 0 calc(var(--u,5px) * .3) #fff,0 0 calc(var(--u,5px) * .15) #fff}
.tok .fBack b{position:absolute;bottom:calc(var(--u,5px) * .7);left:0;right:0;text-align:center;font-weight:900;font-size:calc(var(--u,5px) * 1.15);line-height:1;color:#1f5f8a}
.tok .fBack::after{content:"";position:absolute;inset:0;border-radius:var(--rad);background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.8) 50%,transparent 64%);background-size:260% 100%;animation:glint 2.8s linear infinite}
@keyframes glint{from{background-position:130% 0}to{background-position:-130% 0}}
.tok .hit{width:calc(var(--d) * 1.15);height:calc(var(--d) * 1.15);left:calc(var(--d) * -.575);top:calc(var(--d) * -.575);pointer-events:auto;cursor:default}
.tok.can .hit{cursor:pointer}
.tok .halo{display:none;width:calc(var(--d) * 1.34);height:calc(var(--d) * 1.34);left:calc(var(--d) * -.67);top:calc(var(--d) * -.67);border:calc(var(--u,5px) * .24) dashed #fff;box-shadow:0 0 calc(var(--u,5px) * 1.2) rgba(255,255,255,.7)}
.tok.can .halo{display:block;animation:haloSpin 3s linear infinite}
@keyframes haloSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.09)}100%{transform:rotate(360deg) scale(1)}}
/* freeze / unfreeze: the token hops up and flips over to show its ice face (and back again) */
.tok.flipF .flip{animation:flipF 1.1s cubic-bezier(.35,.1,.25,1)}
.tok.flipU .flip{animation:flipU 1s cubic-bezier(.35,.1,.25,1)}
.tok.flipF .hop,.tok.flipU .hop{animation:hop 1s ease-in-out}
@keyframes flipF{from{transform:rotateY(0deg)}to{transform:rotateY(540deg)}}
@keyframes flipU{from{transform:rotateY(180deg)}to{transform:rotateY(720deg)}}
@keyframes hop{0%,100%{transform:translate3d(0,0,0)}40%{transform:translate3d(0,calc(var(--u,5px) * -2.4),calc(var(--u,5px) * 9))}}
.flash{position:absolute;left:50%;top:50%;translate:-50% -50%;pointer-events:none;font-weight:900;font-size:clamp(22px,6vw,44px);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  padding:12px 26px;border-radius:99px;background:rgba(6,6,12,.88);border:2px solid var(--c,#fff);box-shadow:0 0 34px var(--c,#fff);animation:flash 1.15s ease both;z-index:5}
@keyframes flash{0%{opacity:0;transform:scale(.5)}18%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.panel{padding:16px;margin-bottom:14px}
.dice-row{display:flex;gap:16px;align-items:center}
.die{flex:none;width:76px;height:76px;border-radius:18px;background:linear-gradient(145deg,#fff,#d9d6ea);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;gap:2px;box-shadow:0 8px 18px rgba(0,0,0,.55),inset 0 -5px 8px rgba(80,60,150,.25)}
.die i{border-radius:50%;background:transparent;margin:auto;width:13px;height:13px}
.die i.on{background:radial-gradient(circle at 35% 30%,#5b4a9a,#0c0820)}
.die.rolling{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-9deg) translateY(-2px)}75%{transform:rotate(9deg) translateY(2px)}}
.status{font-weight:700;font-size:15px;line-height:1.4}.status small{display:block;font-weight:500;font-size:12.5px;color:#cfcbe8;margin-top:3px}
#controls{margin-top:14px;display:grid;gap:9px}
#controls:empty{display:none}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:13px 16px;border-radius:18px;font-weight:700;font-size:14px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.5);transition:.16s}
.opt:hover{background:var(--btn);transform:translateX(3px)}
.opt .i{font-size:20px;flex:none}.opt small{display:block;font-weight:500;font-size:11.5px;opacity:.8}
.opt.paid{border-color:#f5c451;box-shadow:inset 0 0 0 1px rgba(245,196,81,.35)}
.opt.danger{border-color:#8fd3ff}.opt.good{border-color:#6ff0a0}
.rollbtn{width:100%;font-size:20px;padding:18px}
.thinking{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;color:#d9d6f0;padding:6px 2px}
.thinking span{width:8px;height:8px;border-radius:50%;background:var(--lav);animation:bounce 1s infinite}.thinking span:nth-child(2){animation-delay:.15s}.thinking span:nth-child(3){animation-delay:.3s}
@keyframes bounce{40%{transform:translateY(-7px)}}
.alert{padding:12px 14px;border-radius:16px;background:rgba(224,41,46,.18);border:1px solid #ff7b7f;font-weight:700;font-size:14px;line-height:1.4}
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;margin-bottom:9px;border-radius:18px;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.18);border-left:6px solid var(--c);transition:.3s}
.pl.me{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.7);border-left-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 40%,transparent)}
.pl b{font-size:15px}.pl .ty{font-size:10px;letter-spacing:.12em;color:#c9c5e6;font-weight:700;text-transform:uppercase}
.coins{display:flex;gap:5px;grid-row:1/3;grid-column:3;align-items:center}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#f0a40f 70%);border:1px solid #8a5a00;box-shadow:0 1px 3px rgba(0,0,0,.6)}
.coin.off{background:transparent;border:1px dashed rgba(255,255,255,.4);box-shadow:none}
.pl .toks{grid-column:1/-1;display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.tk{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.tk.f{background:rgba(143,211,255,.22);border-color:#8fd3ff}.tk.d{background:rgba(111,240,160,.2);border-color:#6ff0a0}
.log{max-height:210px;overflow:auto;font-size:12.5px;line-height:1.5;color:#d6d3ec}
.log div{padding:5px 0;border-bottom:1px solid rgba(255,255,255,.1)}.log div:first-child{color:#fff;font-weight:700}
.log h4,.panel h4{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#bdb8e0;margin-bottom:8px}
.panel h4 .potb{float:right;font-size:10.5px;letter-spacing:.1em;padding:3px 10px;border-radius:99px;background:rgba(245,196,81,.18);border:1px solid #f5c451;color:#ffe9a0;margin-top:-3px}

/* ---------- dice dock: below the board, on the right ---------- */
.dock{display:flex;justify-content:flex-end;margin-top:12px}
.dock .panel{width:min(100%,470px);margin:0;padding:14px 16px}
.dock .panel{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"status die" "ctrl die";column-gap:16px;row-gap:10px;align-items:center}
.dock .panel .die{grid-area:die;align-self:start}
.dock .status{grid-area:status;min-width:0}
.dock #controls{grid-area:ctrl;margin-top:0;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.dock #controls .rollbtn,.dock #controls .alert,.dock #controls .thinking{grid-column:1/-1}
.dock .rollbtn{width:auto;justify-self:start;padding:9px 22px;font-size:14px}
.dock .panel .die{width:64px;height:64px;padding:9px;border-radius:15px}
.dock .die i{width:11px;height:11px}
@media (max-width:480px){.dock .panel{grid-template-areas:"status die" "ctrl ctrl"}}
.dock .opt{padding:10px 12px;font-size:13px}
/* ---------- RANKCO recovery coin ---------- */
.rc{width:30px;height:30px;display:block;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.65))}
.rc.sm{width:28px;height:28px}
.rc.xs{width:16px;height:16px;display:inline-block;vertical-align:-3px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
.rc.off{border:1.5px dashed rgba(255,255,255,.45);border-radius:50%;filter:none;background:rgba(0,0,0,.25)}
.panel h4 .potb .rc{margin-right:4px}
.opt .i{display:grid;place-items:center;min-width:28px}

/* ---------- SCREEN 5 : results ---------- */
#s-results{text-align:center}
.trophy{font-size:clamp(70px,18vw,120px);animation:float 3s ease-in-out infinite;filter:drop-shadow(0 10px 24px rgba(245,169,26,.6))}
.winner{font-weight:900;font-size:clamp(28px,7vw,52px);text-transform:uppercase;letter-spacing:.02em;margin:6px 0 4px}
.winner span{color:var(--c);text-shadow:0 0 30px var(--c)}
.table{margin:22px auto;max-width:640px;padding:18px;text-align:left}
.table .r{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.14)}
.table .r:last-child{border:0}
.table .pos{font-weight:900;font-size:20px;text-align:center}
.table .nm{font-weight:800}.table .nm i{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);margin-right:8px;box-shadow:0 0 8px var(--c)}
.table small{display:block;font-weight:500;color:#cdc9e6;font-size:11.5px;margin-top:3px}
.table .pr{font-weight:800;font-size:13px;color:#e9e5ff}
.res-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards;pointer-events:none;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(3,3,8,.72);backdrop-filter:blur(6px);animation:fade .2s}
.modal.hidden{display:none}
.sheet{width:min(100%,520px);max-height:86vh;overflow:auto;padding:26px}
.sheet h3{font-size:22px;font-weight:800;text-transform:uppercase;margin-bottom:12px}
.sheet p,.sheet li{font-size:14px;line-height:1.55;color:#e6e3f7}
.sheet ul{padding-left:20px;margin:10px 0 18px}.sheet li{margin-bottom:7px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.sheet .acts .btn{padding:12px 22px;font-size:13px}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}


/* ---------- ONLINE PLAY ---------- */
.mode:nth-child(5){--a:#8b6cff;--g:radial-gradient(90% 70% at 50% 0%,rgba(190,185,255,.7),transparent 62%),radial-gradient(70% 55% at 0% 100%,rgba(120,200,255,.35),transparent 62%);animation-delay:.33s;grid-column:1/-1;min-height:clamp(150px,16vw,190px)}
.on-card{padding:22px;margin-top:18px}
.on-status{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13px;padding:10px 14px;border-radius:14px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.22);margin-bottom:18px}
.on-status i{width:10px;height:10px;border-radius:50%;background:#f5a91a;flex:none;animation:pulse 1.2s infinite}
.on-status.ok i{background:#4fd982;animation:none}
.on-status.bad i{background:#ff6b6f;animation:none}
.on-split{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
@media (max-width:700px){.on-split{grid-template-columns:1fr}}
.on-box{padding:16px;border-radius:20px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2)}
.on-box p{font-size:13px;line-height:1.5;color:#d6d3ea;margin:6px 0 14px}
.codein{width:100%;padding:13px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.28);color:#fff;font-weight:900;font-size:26px;letter-spacing:.35em;padding-left:.35em;text-align:center;text-transform:uppercase;outline:none;margin-top:6px}
.codein:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(154,134,230,.5)}
.on-err{color:#ff9a9d;font-weight:700;font-size:13px;min-height:18px;margin-top:12px;text-align:center}
.bigcode{font-family:'Orbitron','Montserrat',sans-serif;font-weight:900;font-size:clamp(40px,13vw,76px);letter-spacing:.18em;padding-left:.18em;margin:10px 0;
  background:linear-gradient(100deg,#d9820f 0%,#fff3b8 30%,#f7c948 55%,#d9820f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(124,92,255,.7))}
.conn{position:fixed;top:0;left:0;right:0;z-index:120;text-align:center;padding:9px 12px;font-weight:800;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;background:#b3261e;color:#fff;transform:translateY(-110%);transition:transform .3s}
.conn.warn{background:#a86a00}
.conn.show{transform:none}


/* ---------- welcome board props: dice, tokens, coins ---------- */
.bgprops{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.bp{position:absolute;width:0;height:0;transform-style:preserve-3d}
.bp .bk{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.bp i{position:absolute;border-radius:50%;transform:translateZ(calc(var(--u) * var(--z,0)))}
.bp .sh{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6) 55%,transparent 100%);transform:translateZ(calc(var(--u) * .06))}
/* token */
.bt .sh{left:calc(var(--u) * -3.2);top:calc(var(--u) * -2.7);width:calc(var(--u) * 7.4);height:calc(var(--u) * 7.4);border-radius:18%;background:rgba(0,0,0,.55);filter:blur(calc(var(--u) * .7))}
.bt i{border-radius:18%;left:calc(var(--u) * -3.7);top:calc(var(--u) * -3.7);width:calc(var(--u) * 7.4);height:calc(var(--u) * 7.4);background:color-mix(in srgb,var(--tc) var(--p),#000)}
.bt .tp{position:absolute;left:calc(var(--u) * -3.7);top:calc(var(--u) * -3.7);width:calc(var(--u) * 7.4);height:calc(var(--u) * 7.4);border-radius:18%;display:grid;place-items:center;transform:translateZ(calc(var(--u) * 1.65));
  background:radial-gradient(circle at 34% 28%,var(--hi) 0,var(--tc) 46%,var(--lo) 100%);
  box-shadow:inset 0 0 0 calc(var(--u) * .18) rgba(255,255,255,.5)}
.bt .tp b{font-weight:900;font-size:calc(var(--u) * 3.5);line-height:1;color:#fff;text-shadow:0 calc(var(--u) * .14) 0 rgba(0,0,0,.5)}
.bt .bk{animation:tokBob 3.4s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes tokBob{from{transform:translateZ(0)}to{transform:translateZ(calc(var(--u) * 1.6))}}
/* coin */
.bc .sh{left:calc(var(--u) * -4);top:calc(var(--u) * -3.7);width:calc(var(--u) * 8);height:calc(var(--u) * 8)}
.bc i{left:calc(var(--u) * -3.4);top:calc(var(--u) * -3.4);width:calc(var(--u) * 6.8);height:calc(var(--u) * 6.8);background:color-mix(in srgb,#d99a14 var(--p),#2b1a00)}
.bc .cf{position:absolute;left:calc(var(--u) * -3.4);top:calc(var(--u) * -3.4);width:calc(var(--u) * 6.8);height:calc(var(--u) * 6.8);transform:translateZ(calc(var(--u) * 1.25))}
.bc .cf svg{display:block;width:100%;height:100%}
.bc .cf,.bc .cb{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.bc .cb{position:absolute;left:calc(var(--u) * -3.4);top:calc(var(--u) * -3.4);width:calc(var(--u) * 6.8);height:calc(var(--u) * 6.8);transform:rotateY(180deg)}
.bc .cb svg{display:block;width:100%;height:100%}
.bc .bk{animation:coinHop 7s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes coinHop{0%,72%{transform:translateZ(0) rotateY(0)}79%{transform:translateZ(calc(var(--u) * 7)) rotateY(180deg)}86%,100%{transform:translateZ(0) rotateY(360deg)}}
/* dice */
.bd{--s:calc(var(--u) * 7.2);--h:calc(var(--s) / 2)}
.bd .sh{left:calc(var(--s) * -.7);top:calc(var(--s) * -.62);width:calc(var(--s) * 1.4);height:calc(var(--s) * 1.4)}
.bd .dh{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translateZ(var(--h));animation:dHop 9s ease-in-out infinite;animation-delay:var(--dl,0s)}

<script>
/* ==========================================================================
   RANKCO ENGINE
   Pure, deterministic and serialisable. No DOM, no timers, no globals.

   state' = apply(state, action).state   (+ an ordered list of events for the UI)

   Online multiplayer later: run this same engine on a server, send `action`
   objects over the wire, and have the server pass the authoritative dice value
   as apply(state, {type:'roll'}, {dice: n}). The UI only renders state/events,
   so no part of the engine needs rewriting. Seats already carry a `type`
   ('human' | 'ai' | 'remote').
   ========================================================================== */
const RankcoEngine = (() => {
  'use strict';

  const COLORS = ['blue', 'red', 'green', 'orange'];      // clockwise seating order
  const SIDE = 9;                                          // tiles on each side of the board
  const RING = 4 * SIDE;                                   // 36 tiles on the shared loop (10 x 10 board)
  const LANE = 3;                                          // arrow tiles inside the board that lead to the centre
  const LAYERS = 4;                                        // 4 rounds, each on its own layer: outer ring (star 1) ... inner ring (star 4)
  const S_OF = [9, 7, 5, 3];                               // tiles per side on each layer
  const R_OF = S_OF.map((x) => x * 4);                     // 36, 28, 20, 12 tiles per layer
  const OFF = [0, 36, 64, 84];                             // first progress value / first tile id of each layer
  const GOAL = 96;                                         // progress value of the centre (36 + 28 + 20 + 12)                                // progress value of the centre (39)
  const YARD = -1;                                         // token outside the board
  const FREEZE_FROM = OFF[2];                                // three-star and four-star levels
  const START_COINS = 2;
  // Each colour owns one side of the board; its home tile is the corner where the side begins.
  const START_INDEX = { blue: 0, red: 9, green: 18, orange: 27 };
  // Salutation tiles sit in the middle of each side.
  const SALUTE_OWNER = { 4: 'blue', 13: 'red', 22: 'green', 31: 'orange' };

  /* ---------- helpers ---------- */
  function rand(s) {                                       // mulberry32, seed lives in state
    s.seed = (s.seed + 0x6D2B79F5) | 0;
    let t = Math.imul(s.seed ^ (s.seed >>> 15), 1 | s.seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  const clone = (s) => JSON.parse(JSON.stringify(s));
  const tileOf = (pl, p) => (p < 0 || p >= GOAL ? -1 : OFF[layerOf(p)] + (COLORS.indexOf(pl.color) * S_OF[layerOf(p)] + p - OFF[layerOf(p)]) % R_OF[layerOf(p)]);   // -1: off the loop (waiting, on the arrow lane, or home)
  const levelOf = (p) => (p < 0 ? 0 : p >= GOAL ? 5 : layerOf(p) + 1);
  const inPlay = (t) => t.p >= 0 && t.p < GOAL;
  const layerOf = (p) => (p < 36 ? 0 : p < 64 ? 1 : p < 84 ? 2 : 3);
  const isHome = (p) => OFF.includes(p);                   // a colour's home corner on any layer
  const layerPos = (pl, p) => { const L = layerOf(p); return { L, k: (COLORS.indexOf(pl.color) * S_OF[L] + p - OFF[L]) % R_OF[L] }; };

  /* ---------- setup ---------- */
  function createGame(cfg) {
    const seeded = cfg.seed != null ? cfg.seed : (Math.random() * 4294967296) >>> 0;
    const sorted = cfg.players.slice().sort((a, b) => COLORS.indexOf(a.color) - COLORS.indexOf(b.color));
    const players = sorted.map((p, i) => ({
      id: i, name: p.name, color: p.color, type: p.type || 'human', difficulty: p.difficulty || null,
      coins: START_COINS, spent: 0,
      tokens: [{ id: 0, p: YARD, frozen: false }, { id: 1, p: YARD, frozen: false }],
      stats: { rolls: 0, sixes: 0, setbacksGiven: 0, setbacksTaken: 0, coinsSpent: 0, salutes: 0, freezes: 0 }
    }));
    const s = { v: 1, seed: seeded, players, turn: 0, phase: 'roll', awaiting: 0, roll: null, lastRoll: null,
                bonus: false, pending: null, winner: null, turnCount: 0 };
    let first = cfg.startColor ? players.findIndex((p) => p.color === cfg.startColor) : -1;
    if (first < 0) first = Math.floor(rand(s) * players.length);
    s.turn = s.awaiting = first;
    return s;
  }

  /* ---------- movement rules ---------- */
  // Tokens of the same player cannot skip over or land on each other.
  function canMove(pl, tok, v) {
    if (!inPlay(tok) || tok.frozen) return false;
    const to = tok.p + v;
    return !pl.tokens.some((o) => o !== tok && inPlay(o) && o.p > tok.p && o.p <= to);
  }
  const startFree = (pl) => !pl.tokens.some((t) => t.p === 0);

  function tokensOnTile(s, tile, except) {
    const out = [];
    s.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => {
      if (inPlay(t) && tileOf(pl, t.p) === tile && !(except && except.pi === pi && except.ti === ti)) out.push({ pi, ti });
    }));
    return out;
  }

  /* ---------- options ---------- */
  function listOptions(s) {
    if (s.phase === 'over') return [];
    if (s.phase === 'setback') {
      const v = s.pending.victims[0];
      return [{ type: 'setback_pay', token: v.ti, paid: true }, { type: 'setback_accept', token: v.ti }];
    }
    const P = s.players[s.turn];
    if (s.phase === 'roll') {
      const o = [{ type: 'roll' }];
      if (P.coins > 0) P.tokens.forEach((t) => { if (t.frozen && inPlay(t)) o.push({ type: 'unfreeze_pay', token: t.id, paid: true }); });
      return o;
    }
    // phase === 'act'
    const v = s.roll, free = [], paid = [];
    let yardSeen = false;
    P.tokens.forEach((t) => {
      if (t.p === GOAL) return;
      if (t.p === YARD) {
        if (yardSeen || !startFree(P)) return;
        yardSeen = true;
        if (v === 6) free.push({ type: 'enter', token: t.id });
        else if (P.coins > 0) paid.push({ type: 'enter_pay', token: t.id, paid: true });
      } else if (t.frozen) {
        if (v === 6) free.push({ type: 'unfreeze', token: t.id });
        if (P.coins > 0) paid.push({ type: 'unfreeze_pay', token: t.id, paid: true });
      } else if (v === 1 && t.p >= FREEZE_FROM) {
        free.push({ type: 'freeze', token: t.id });          // rolling a 1 at three/four-star freezes it
      } else if (canMove(P, t, v)) {
        free.push({ type: 'move', token: t.id });
      }
    });
    if (s.bonus && P.spent > 0) free.push({ type: 'recover' });
    if (free.length === 0) free.push({ type: 'pass', free0: true });
    // 'pass' is only a real choice when a paid alternative exists; otherwise it is automatic
    return free.concat(paid);
  }

  // The single obvious action, if any (controllers apply it after a short pause).
  function autoAction(s) {
    if (s.phase !== 'act') return null;
    const o = listOptions(s);
    if (o.length === 1) { const a = Object.assign({}, o[0]); delete a.free0; return a; }
    return null;
  }

  const same = (o, a) => o.type === a.type && (o.token === undefined || o.token === a.token);

  /* ---------- internals ---------- */
  function spendCoin(s, pi, events, reason) {
    const pl = s.players[pi];
    pl.coins--; pl.spent++; pl.stats.coinsSpent++;
    events.push({ t: 'coin', pi, reason });
  }

  function doMove(s, pi, ti, steps, events, allowSalute) {
    const pl = s.players[pi], tok = pl.tokens[ti];
    const from = tok.p, to = Math.min(from + steps, GOAL), path = [];
    for (let q = from + 1; q <= to; q++) path.push(q);
    tok.p = to;
    events.push({ t: 'move', pi, ti, from, to, steps, path });
    if (to === GOAL) { events.push({ t: 'finish', pi, ti }); s.pending = null; return; }
    startLanding(s, pi, ti, allowSalute, events);
  }

  function startLanding(s, pi, ti, allowSalute, events) {
    const pl = s.players[pi], tok = pl.tokens[ti], tile = tileOf(pl, tok.p);
    if (tile < 0) { s.pending = { pi, ti, victims: [], salute: false, decided: false }; return; }   // the arrow lane is safe ground
    const victims = [];
    s.players.forEach((op, oi) => {
      if (oi === pi) return;
      op.tokens.forEach((ot, oti) => {
        // home tile protects; frozen tokens are unaffected by setbacks
        if (inPlay(ot) && !ot.frozen && !isHome(ot.p) && tileOf(op, ot.p) === tile) victims.push({ pi: oi, ti: oti });
      });
    });
    let salute = false;
    const ownerColor = SALUTE_OWNER[tile];
    if (allowSalute && ownerColor && ownerColor !== pl.color) {   // any other colour's soldier tile counts, even if nobody plays that colour
      const oi = s.players.findIndex((p) => p.color === ownerColor);
      if (canMove(pl, tok, 3)) {
        salute = true; pl.stats.salutes++;
        events.push({ t: 'salute', pi, ti, owner: oi, ownerColor, tile });
      }
    }
    s.pending = { pi, ti, victims, salute, decided: false };
  }

  function applySetback(s, v, pd, events) {
    const op = s.players[v.pi], tok = op.tokens[v.ti], from = tok.p;
    const path = [from];
    let q = from - 6;
    // keep going back 6 tiles while the landing tile is occupied
    while (q >= 0 && tokensOnTile(s, tileOf(op, q), { pi: v.pi, ti: v.ti }).length) { path.push(q); q -= 6; }
    if (q < 0) q = YARD;
    path.push(q);
    tok.p = q; tok.frozen = false;
    op.stats.setbacksTaken++; s.players[pd.pi].stats.setbacksGiven++;
    events.push({ t: 'setback', pi: v.pi, ti: v.ti, from, to: q, path, by: pd.pi });
  }

  // Resolve landings until a human/AI decision is needed ('wait') or everything is settled ('done').
  function runPending(s, events) {
    while (s.pending) {
      const pd = s.pending;
      if (pd.victims.length) {
        const v = pd.victims[0];
        if (s.players[v.pi].coins > 0 && !pd.decided) { s.phase = 'setback'; s.awaiting = v.pi; return 'wait'; }
        pd.decided = false; pd.victims.shift();
        applySetback(s, v, pd, events);
        continue;
      }
      if (pd.salute) {                                       // 3 bonus moves, taken immediately
        pd.salute = false;
        const pl = s.players[pd.pi];
        if (canMove(pl, pl.tokens[pd.ti], 3)) doMove(s, pd.pi, pd.ti, 3, events, false);
        continue;
      }
      s.pending = null;
    }
    s.phase = 'act'; s.awaiting = s.turn;
    return 'done';
  }

  function finish(s, events) {
    const w = s.players.find((pl) => pl.tokens.every((t) => t.p === GOAL));
    if (w) { s.phase = 'over'; s.winner = w.id; s.awaiting = null; s.roll = null; events.push({ t: 'win', pi: w.id }); return; }
    if (s.roll === 6) {                                      // rolling a 6 earns a bonus roll
      s.phase = 'roll'; s.bonus = true; s.roll = null; s.awaiting = s.turn;
      events.push({ t: 'bonus', pi: s.turn });
    } else {
      s.turn = (s.turn + 1) % s.players.length;
      s.phase = 'roll'; s.bonus = false; s.roll = null; s.awaiting = s.turn; s.turnCount++;
      events.push({ t: 'turn', pi: s.turn });
    }
  }

  /* ---------- the one entry point ---------- */
  function apply(state, action, opts) {
    const s = clone(state), events = [];
    if (s.phase === 'over') return { error: 'game over' };
    if (!listOptions(s).some((o) => same(o, action))) return { error: 'illegal action', action };
    const pi = s.phase === 'setback' ? s.awaiting : s.turn;
    const P = s.players[pi];
    const tok = action.token !== undefined ? P.tokens[action.token] : null;
    const duringRoll = s.phase === 'roll';

    switch (action.type) {
      case 'roll': {
        const v = opts && opts.dice ? opts.dice : 1 + Math.floor(rand(s) * 6);
        s.roll = s.lastRoll = v; P.stats.rolls++; if (v === 6) P.stats.sixes++;
        s.phase = 'act';
        events.push({ t: 'roll', pi, value: v, bonus: s.bonus });
        return { state: s, events };
      }
      case 'unfreeze_pay':
        spendCoin(s, pi, events, 'unfreeze'); tok.frozen = false;
        events.push({ t: 'unfreeze', pi, ti: tok.id, paid: true });
        if (duringRoll) return { state: s, events };         // still to roll this turn
        finish(s, events); return { state: s, events };
      case 'unfreeze':
        tok.frozen = false; events.push({ t: 'unfreeze', pi, ti: tok.id, paid: false });
        finish(s, events); return { state: s, events };
      case 'freeze':
        tok.frozen = true; P.stats.freezes++; events.push({ t: 'freeze', pi, ti: tok.id });
        finish(s, events); return { state: s, events };
      case 'recover':
        P.coins++; P.spent--; events.push({ t: 'recover', pi });
        finish(s, events); return { state: s, events };
      case 'pass':
        events.push({ t: 'pass', pi });
        finish(s, events); return { state: s, events };
      case 'enter': case 'enter_pay':
        if (action.type === 'enter_pay') spendCoin(s, pi, events, 'enter');
        tok.p = 0; events.push({ t: 'enter', pi, ti: tok.id, paid: action.type === 'enter_pay' });
        startLanding(s, pi, tok.id, false, events);
        break;
      case 'move':
        doMove(s, pi, tok.id, s.roll, events, true);
        break;
      case 'setback_pay': {
        spendCoin(s, pi, events, 'hold');
        const v = s.pending.victims.shift();
        events.push({ t: 'hold', pi: v.pi, ti: v.ti });
        s.pending.decided = false;
        break;
      }
      case 'setback_accept':
        s.pending.decided = true;
        break;
    }
    if (runPending(s, events) === 'done') finish(s, events);
    return { state: s, events };
  }

  /* ---------- reporting ---------- */
  const progressOf = (pl) => pl.tokens.reduce((a, t) => a + (t.p < 0 ? 0 : t.p), 0);
  function ranking(s) {
    return s.players.map((pl) => ({ pl, score: progressOf(pl) + (pl.id === s.winner ? 1000 : 0) }))
      .sort((a, b) => b.score - a.score).map((x) => x.pl);
  }

  return { COLORS, SIDE, RING, LAYERS, S_OF, R_OF, OFF, LANE, GOAL, YARD, FREEZE_FROM, START_INDEX, SALUTE_OWNER,
           createGame, listOptions, autoAction, apply, canMove, tileOf, levelOf, inPlay, layerOf, layerPos, isHome, progressOf, ranking };
})();

<script>
/* ==========================================================================
   RANKCO AI  (Easy / Medium / Hard)
   Controllers only ever return an `action` the engine already listed as legal,
   so a remote/online controller can replace this module without touching the engine.
   ========================================================================== */
const RankcoAI = (() => {
  'use strict';
  const E = RankcoEngine;
  const COIN_VALUE = { medium: 4.5, hard: 5.5 };

  const pick = (a, r) => a[Math.floor(r() * a.length)];

  // Positive = good for player `me`.
  function evaluate(s, me, d) {
    const P = s.players[me];
    let score = P.coins * COIN_VALUE[d];
    const risk = d === 'hard' ? 1 : 0.5;
    P.tokens.forEach((t) => {
      if (t.p === E.GOAL) { score += E.GOAL + 70; return; }
      if (t.p >= 0) score += t.p + 8;
      if (t.frozen) score -= d === 'hard' ? 10 : 6;
      if (E.inPlay(t) && !t.frozen && t.p > 0) {
        const mp = E.layerPos(P, t.p);
        s.players.forEach((op, oi) => {
          if (oi === me) return;
          op.tokens.forEach((ot) => {
            if (!E.inPlay(ot) || ot.frozen) return;
            const oq = E.layerPos(op, ot.p); if (oq.L !== mp.L) return;
            const dist = (mp.k - oq.k + E.R_OF[mp.L]) % E.R_OF[mp.L];
            if (dist >= 1 && dist <= 6) {
              const loss = (t.p <= 6 ? t.p + 8 : 6) * (P.coins > 0 ? 0.6 : 1);
              score -= (1 / 6) * loss * risk;
            }
          });
        });
        if (d === 'hard' && t.p >= E.FREEZE_FROM) score -= 1.6;   // a roll of 1 would freeze it
      }
    });
    s.players.forEach((op, oi) => {
      if (oi === me) return;
      op.tokens.forEach((t) => {
        if (t.p === E.GOAL) score -= 0.6 * (E.GOAL + 9); else if (t.p >= 0) score -= 0.6 * (t.p + 8);
        if (t.frozen) score += 3;
      });
    });
    return score;
  }

  function simulate(s, a) {
    let r = E.apply(s, a);
    if (r.error) return null;
    let st = r.state, guard = 0;
    while (st.phase === 'setback' && guard++ < 6) {           // assume opponents accept setbacks
      r = E.apply(st, { type: 'setback_accept' });
      if (r.error) break;
      st = r.state;
    }
    return st;
  }

  function chooseAct(s, difficulty, r) {
    const me = s.turn, opts = E.listOptions(s);
    const freeOpts = opts.filter((o) => !o.paid && o.type !== 'pass');
    const paidOpts = opts.filter((o) => o.paid);
    const pass = { type: 'pass' };

    if (difficulty === 'beginner') return freeOpts.length ? pick(freeOpts, r) : pass;   // random legal move, never spends coins
    if (difficulty === 'easy') {
      if (freeOpts.length) {
        const enter = freeOpts.find((o) => o.type === 'enter');
        if (enter && r() < 0.8) return enter;
        return pick(freeOpts, r);
      }
      if (paidOpts.length && r() < 0.35) return pick(paidOpts, r);
      return pass;
    }
    const jitter = difficulty === 'hard' ? 0.2 : 1.6;
    let best = null, bestScore = -Infinity;
    const cands = freeOpts.concat(paidOpts);
    cands.push(pass);
    cands.forEach((a) => {
      const st = simulate(s, a);
      if (!st) return;
      const sc = evaluate(st, me, difficulty) + (r() - 0.5) * jitter;
      if (sc > bestScore) { bestScore = sc; best = a; }
    });
    return best || pass;
  }

  function choose(s, difficulty, r) {
    r = r || Math.random;
    difficulty = difficulty || 'medium';
    const opts = E.listOptions(s);
    if (s.phase === 'roll') {
      const P = s.players[s.turn];
      const un = opts.find((o) => o.type === 'unfreeze_pay');
      if (un && difficulty !== 'easy' && difficulty !== 'beginner') {
        const t = P.tokens[un.token];
        const worth = difficulty === 'hard' ? t.p >= 30 && (P.coins === 2 || t.p >= 70) : t.p >= 50 && P.coins === 2;
        if (worth) return un;
      }
      return { type: 'roll' };
    }
    if (s.phase === 'setback') {
      const v = s.pending.victims[0], op = s.players[v.pi], t = op.tokens[v.ti];
      // estimate what the setback would cost
      let q = t.p - 6;
      const loss = q < 0 ? t.p + 8 : 6;
      if (difficulty === 'beginner') return { type: 'setback_accept', token: v.ti };
      if (difficulty === 'easy') return r() < 0.3 ? { type: 'setback_pay', token: v.ti } : { type: 'setback_accept', token: v.ti };
      const threshold = difficulty === 'hard' ? (op.coins === 1 ? 9 : 7) : 10;
      return loss >= threshold || t.p >= 58 ? { type: 'setback_pay', token: v.ti } : { type: 'setback_accept', token: v.ti };
    }
    const auto = E.autoAction(s);
    if (auto) return auto;
    return chooseAct(s, difficulty, r);
  }

  return { choose, evaluate };
})();

  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const HEX = { blue: '#2b7de9', red: '#e0292e', green: '#1e9e4a', orange: '#f39419' };
  const LIGHT = { blue: '#7db6ff', red: '#ff8a8d', green: '#62dd8b', orange: '#ffc06a' };

  const COIN = '<svg class="rc sm" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg>';
  const COINI = '<svg class="rc xs" viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg>';

  const MODES = {
    computer: { icon: '🤖', title: 'Play vs Computer', desc: 'Challenge the computer in an exciting game of RANKCO.', tag: 'Easy · Medium · Hard' },
    two:      { icon: '👥', title: 'Two Players', desc: 'Challenge a friend in a two-player match.', humans: 2, tag: 'Same device' },
    three:    { icon: '👨‍👦‍👦', title: 'Three Players', desc: 'Bring another player into the competition.', humans: 3, tag: 'Same device' },
    four:     { icon: '👨‍👩‍👦‍👦', title: 'Four Players', desc: 'Experience the complete RANKCO competition.', humans: 4, tag: 'Same device' },
  };
  MODES.online = { icon: '🌐', title: 'Play Online', desc: 'Play a friend on another device – create a room and share the code.', tag: '2 players · Internet' };
  const MODE_KEYS = ['computer', 'two', 'three', 'four', 'online'];

  /* app-level state – survives navigation so Back never loses selections */
  const app = { screen: 'splash', online: null, mode: null, setups: {}, session: null, busy: false, loop: 0, opts: [], view: {}, log: [] };

  /* ===================================================================
     NAVIGATION
     =================================================================== */
  const ORDER = ['splash', 'welcome', 'modes', 'online', 'setup', 'game', 'results'];
  function go(name) {
    const idx = ORDER.indexOf(name);
    ORDER.forEach((n, i) => {
      const el = $('#s-' + n);
      el.classList.toggle('active', i === idx);
      el.classList.toggle('before', i < idx);
    });
    app.screen = name;
    const ap = $('#app'); ap.scrollLeft = 0; ap.scrollTop = 0;   // never let the parked (off-screen) screens scroll the app sideways
    const el = $('#s-' + name);
    if (el.scrollTo) el.scrollTo(0, 0);
  }

  /* ===================================================================

  function buildOrbit() {
    let h = '<svg viewBox="-100 -100 200 200">';

      const side = Math.floor(k / 10), ang = k * 9 - 45;
      h += `<rect x="-3.1" y="-97" width="6.2" height="8.6" rx="1.7" fill="${HEX[E.COLORS[side]]}" transform="rotate(${ang})" style="animation-delay:${(k * 0.12).toFixed(2)}s"/>`;
    }
    $('#orbit').innerHTML = h + '</svg>';
  }
  $('#playNow').onclick = () => { renderModes(); go('modes'); };

  /* ===================================================================
     SCREEN 2 – game modes
