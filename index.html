  function renderModes() {
    $('#modeGrid').innerHTML = MODE_KEYS.map((k) => {
      const m = MODES[k];
      return `<button class="mode${app.mode === k ? ' selected' : ''}" data-mode="${k}" aria-pressed="${app.mode === k}">
        <span class="check">✓</span><span class="ico">${m.icon}</span><h3>${m.title}</h3><p>${m.desc}</p><span class="tag">${m.tag}</span></button>`;
    }).join('');
    $$('.mode').forEach((b) => b.onclick = () => {
      app.mode = b.dataset.mode;
      $$('.mode').forEach((x) => x.classList.toggle('selected', x === b));
      setTimeout(() => { if (app.mode === 'online') { renderOnline(); go('online'); } else { renderSetup(); go('setup'); } }, 320);
    });
  }
  $('#modesBack').onclick = () => go('welcome');

  /* ===================================================================
     SCREEN 3 – player setup
     =================================================================== */
  function ensureSetup(mode) {
    if (!app.setups[mode]) {
      const prev = Object.values(app.setups)[0];
      app.setups[mode] = {
        names: prev ? prev.names.slice() : ['Player 1', 'Player 2', 'Player 3', 'Player 4'],
        colors: mode === 'three' || mode === 'four' ? ['blue', 'red', 'green', 'orange'] : ['blue', 'green', 'red', 'orange'],
        aiCount: 1, difficulty: 'medium', first: 'random',
      };
    }
    return app.setups[mode];
  }
  function seatsOf(mode) {
    const s = ensureSetup(mode);
    const count = mode === 'computer' ? 1 + s.aiCount : MODES[mode].humans;
    return Array.from({ length: count }, (_, i) => {
      const ai = mode === 'computer' && i > 0;
      return { idx: i, ai, color: s.colors[i], name: ai ? (s.aiCount > 1 ? `Computer ${i}` : 'Computer') : (s.names[i].trim() || `Player ${i + 1}`) };
    });
  }

  function renderSetup() {
    const mode = app.mode, m = MODES[mode], s = ensureSetup(mode);
    const root = $('#setupRoot');
    root.innerHTML = `
      <button class="back" id="setupBack">‹ Back</button>
      <h2 class="pill-title">Player Setup</h2>
      <div class="mode-chip" style="margin-top:18px"><span class="ico">${m.icon}</span><div><small>SELECTED MODE</small><b>${m.title}</b></div><button class="btn dark" id="chg">Change</button></div>
      <div class="setup-grid">
        <div class="form glass" id="form"></div>
        <div class="summary glass" id="summary"></div>
      </div>`;
    $('#setupBack').onclick = () => { renderModes(); go('modes'); };
    $('#chg').onclick = () => { renderModes(); go('modes'); };
    renderForm();
    renderSummary();
  }

  function renderForm() {
    const mode = app.mode, s = ensureSetup(mode), seats = seatsOf(mode);
    let h = '';
    if (mode === 'computer') {
      h += `<div class="row"><label>Computer opponents</label><div class="seg" id="aiCount">${[1, 2, 3].map((n) => `<button data-v="${n}" class="${s.aiCount === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
            <div class="row"><label>AI difficulty</label><div class="seg" id="diff">${['beginner', 'easy', 'medium', 'hard'].map((d) => `<button data-v="${d}" class="${s.difficulty === d ? 'on' : ''}">${DIFF[d]}</button>`).join('')}</div></div>`;
    }
    h += `<div class="row"><label>${mode === 'computer' ? 'You &amp; your opponents' : 'Players'}</label>`;
    seats.forEach((st) => {
      h += `<div class="seat" style="--c:${HEX[st.color]}"><div class="num">${st.idx + 1}</div>
        ${st.ai ? `<div class="ai-name">🤖 ${esc(st.name)}<small>${DIFF[s.difficulty]} · AI</small></div>`
                : `<input class="name" data-i="${st.idx}" maxlength="14" value="${esc(s.names[st.idx])}" placeholder="Player ${st.idx + 1}" aria-label="Player ${st.idx + 1} name" autocomplete="off">`}
        <div class="swatches" role="group" aria-label="Colour">${E.COLORS.map((c) => `<button class="sw${st.color === c ? ' on' : ''}" style="--c:${HEX[c]}" data-i="${st.idx}" data-c="${c}" title="${CNAME[c]}" aria-label="${CNAME[c]}"></button>`).join('')}</div></div>`;
    });
    h += '</div>';
    h += `<div class="row"><label>Who starts?</label><div class="seg" id="first"></div></div>`;
    $('#form').innerHTML = h;

    const again = () => { renderForm(); renderSummary(); };
    if (mode === 'computer') {
      $$('#aiCount button').forEach((b) => b.onclick = () => { s.aiCount = +b.dataset.v; s.first = 'random'; again(); });
      $$('#diff button').forEach((b) => b.onclick = () => { s.difficulty = b.dataset.v; again(); });
    }
    $$('.name').forEach((inp) => inp.oninput = () => { s.names[+inp.dataset.i] = inp.value; renderSummary(); renderFirst(); });
    $$('.sw').forEach((b) => b.onclick = () => {
      const i = +b.dataset.i, c = b.dataset.c, j = s.colors.indexOf(c);
      if (j !== i) { s.colors[j] = s.colors[i]; s.colors[i] = c; }          // swap so colours stay unique
      again();
    });
    renderFirst();
  }

  function renderFirst() {
    const s = ensureSetup(app.mode), seats = seatsOf(app.mode);
    if (s.first !== 'random' && !seats.some((x) => x.color === s.first)) s.first = 'random';
    $('#first').innerHTML = `<button data-v="random" class="${s.first === 'random' ? 'on' : ''}">🎲 Random</button>` +
      seats.map((x) => `<button data-v="${x.color}" class="${s.first === x.color ? 'on' : ''}"><span class="dot" style="background:${HEX[x.color]}"></span>${esc(x.name)}</button>`).join('');
    $$('#first button').forEach((b) => b.onclick = () => { s.first = b.dataset.v; renderFirst(); renderSummary(); });
  }

  function renderSummary() {
    const mode = app.mode, m = MODES[mode], s = ensureSetup(mode);
    const seats = seatsOf(mode).slice().sort((a, b) => E.COLORS.indexOf(a.color) - E.COLORS.indexOf(b.color));
    const firstTxt = s.first === 'random' ? 'Random' : seats.find((x) => x.color === s.first).name;
    $('#summary').innerHTML = `
      <div class="lbl">Game summary</div>
      <div class="facts">
        <div class="fact"><small>Mode</small><b>${m.icon} ${m.title}</b></div>
        <div class="fact"><small>${mode === 'computer' ? 'Difficulty' : 'Device'}</small><b>${mode === 'computer' ? DIFF[s.difficulty] : 'Pass &amp; play'}</b></div>
        <div class="fact"><small>Players</small><b>${seats.length}</b></div>
        <div class="fact"><small>First turn</small><b>${esc(firstTxt)}</b></div>
      </div>
      <div class="lbl">Turn order · clockwise</div>
      <ul class="sum-list">${seats.map((x) => `<li style="--c:${HEX[x.color]}"><span class="c"></span>${esc(x.name)}<span class="t">${CNAME[x.color]}<br>${x.ai ? DIFF[s.difficulty] + ' AI' : 'Human'}</span></li>`).join('')}</ul>
      <button class="btn start" id="startGame" style="margin-top:18px">Start Game</button>`;
    $('#startGame').onclick = startGame;
  }

  /* ===================================================================
     GAME – board drawing
     =================================================================== */
  const ringXY = (k) => (k < 9 ? [k, 0] : k < 18 ? [9, k - 9] : k < 27 ? [9 - (k - 18), 9] : [0, 9 - (k - 27)]);   // [col,row] on the 10 x 10 grid, clockwise from the top-left corner
  const cellXY = (c, r) => [c * 10 + 5, r * 10 + 5];
  const layerXY = (L, k) => { const S = 9 - 2 * L, a = Math.floor(k / S), j = k % S; return a === 0 ? [L + j, L] : a === 1 ? [9 - L, L + j] : a === 2 ? [9 - L - j, 9 - L] : [L, 9 - L - j]; };   // [col,row] of tile k on layer L, clockwise from that layer's top-left corner
  const tileCenter = (id) => { const L = id < 36 ? 0 : id < 64 ? 1 : id < 84 ? 2 : 3; const [c, r] = layerXY(L, id - E.OFF[L]); return cellXY(c, r); };
  const rotCell = (r, c, n) => { for (let i = 0; i < n; i++) [r, c] = [c, 9 - r]; return [r, c]; };   // n quarter turns clockwise
  const rotOff = (o, n) => { let [x, y] = o; for (let i = 0; i < n; i++) [x, y] = [-y, x]; return [x, y]; };
  const cIdx = (color) => E.COLORS.indexOf(color);
  const LANE0 = [[1, 7], [2, 6], [3, 5]];                        // red's arrow lane (row, col); the other colours are quarter turns of it
  const laneXY = (n, j) => { const [r, c] = rotCell(LANE0[j][0], LANE0[j][1], (n + 3) % 4); return cellXY(c, r); };
  const DONE_C = [[44, 56], [44, 44], [56, 44], [56, 56]];       // finished tokens rest in the corner of the centre square their lane points at
  const doneXY = (n, ti) => { const [x, y] = DONE_C[n], dx = Math.sign(x - 50), dy = Math.sign(y - 50), k = ti ? 1.55 : -1.55; return [x - k * dy, y + k * dx]; };
  // waiting tokens and coins sit in a small tray outside the leather frame, next to the player's own home corner
  const TRAY = { blue: [-7, -19], red: [61, -19], green: [61, 112], orange: [-7, 112] }, TRAY_W = 46, TRAY_H = 10;
  const yardXY = (color, ti) => [TRAY[color][0] + 6.5 + ti * 10, TRAY[color][1] + 5];
  const POT_ORDER = [0, 4, 2, 6, 1, 5, 3, 7];                    // first four coins sit N / S / E / W of the centre
  const potXY = (k) => { const a = (-90 + POT_ORDER[k % 8] * 45) * Math.PI / 180; return [50 + 5 * Math.cos(a), 50 + 5 * Math.sin(a)]; };
  const coinXY = (color, i) => [TRAY[color][0] + 31.4 + i * 7.8, TRAY[color][1] + 5];
  const star = (r, ri, n = 5) => Array.from({ length: n * 2 }, (_, i) => { const a = -Math.PI / 2 + (i * Math.PI) / n, rr = i % 2 ? ri : r; return (Math.cos(a) * rr).toFixed(2) + ',' + (Math.sin(a) * rr).toFixed(2); }).join(' ');

  const DARKC = { blue: '#0b3a78', red: '#7a0f13', green: '#0a4a25', orange: '#8a4700' };
  const TOPC = { blue: '#3f98f0', red: '#f04a4f', green: '#33b762', orange: '#ffb23f' };
  const SOLD = { blue: '#2b86e6', red: '#e0292e', green: '#2fa65a', orange: '#f5b21a' };
  const rr = (x, y, w, h, a, b, c, d) => `M${x + a} ${y}H${x + w - b}Q${x + w} ${y} ${x + w} ${y + b}V${y + h - c}Q${x + w} ${y + h} ${x + w - c} ${y + h}H${x + d}Q${x} ${y + h} ${x} ${y + h - d}V${y + a}Q${x} ${y} ${x + a} ${y}Z`;
  const ARROW = 'M0 -2.9L2.8 0H1.1V2.9H-1.1V0H-2.8Z';
  // dice-style pip faces of the interior tiles (drawn for the top/blue quarter, then turned for the other three)
  const PIPS = { two: [[-2.3, -2.3], [2.3, 2.3]], ell: [[-2.3, -2.3], [2.3, -2.3], [-2.3, 2.3]], row: [[-3, 0], [0, 0], [3, 0]], four: [[-2.3, -2.3], [2.3, -2.3], [-2.3, 2.3], [2.3, 2.3]] };
  const BASE = [[1, 1, 'two'], [1, 2, 'two'], [1, 3, 'two'], [1, 4, 'two'], [1, 5, 'two'], [1, 6, 'two'], [1, 7, 'arrow'],
                [2, 2, 'ell'], [2, 3, 'row'], [2, 4, 'row'], [2, 5, 'row'], [2, 6, 'arrow'],
                [3, 3, 'four'], [3, 4, 'four'], [3, 5, 'arrow']];

  const tile = (c, r, color, radii) => `<path d="${rr(c * 10 + .5, r * 10 + .5, 9, 9, ...radii)}" fill="url(#t-${color})" stroke="${DARKC[color]}" stroke-width=".4"/>`;
  const pip = (x, y) => `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)})"><circle r="1.3" fill="#1c1604"/><circle r="1.02" fill="url(#gold)"/><polygon points="${star(.78, .32)}" fill="#fff3b0"/></g>`;
  const starTile = (cx, cy, color) => `<circle cx="${cx}" cy="${cy}" r="3.55" fill="url(#t-${color})" stroke="#0a0a0f" stroke-width=".6"/><polygon points="${star(2.95, 1.2)}" transform="translate(${cx} ${cy + .1})" fill="url(#gold)" stroke="#6d4300" stroke-width=".28" stroke-linejoin="round"/>`;
  const arrowGlyph = (cx, cy, region, owner) => `<path d="${ARROW}" transform="translate(${cx} ${cy}) rotate(${180 + 90 * region}) scale(.85)" fill="${HEX[owner]}" stroke="${DARKC[owner]}" stroke-width=".35" stroke-linejoin="round"/>`;
  const soldier = (cx, cy, color, side) => `<g transform="translate(${cx} ${cy}) rotate(${[180, 270, 0, 90][side]}) scale(.85) translate(-.6 .2)" fill="${SOLD[color]}">
      <path d="M-2.4 -2.7C-2.4 -4.6 -1.2 -5.2 .2 -5.2C1.8 -5.2 2.8 -4.4 2.8 -2.7Z"/><path d="M-3.2 -2.9H3.6L3.2 -2.2H-2.8Z"/>
      <ellipse cx=".2" cy="-.7" rx="1.6" ry="1.75"/><rect x="-.6" y=".6" width="1.6" height="1.2"/>
      <path d="M-3.6 5.2C-3.9 3 -3.8 1.6 -2.2 1L-.6 .5H1.2L2.7 1C4.1 1.6 4.2 3 3.9 5.2Z"/>
      <path d="M2.8 1.9L4.7 .3L3.5 -2" fill="none" stroke="${SOLD[color]}" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  const CENTRE_FALLBACK = `<g transform="translate(50 50)"><circle r="5.2" fill="#fdb10a" stroke="#0a0a0a" stroke-width=".9"/><path d="M-3.6 -3.4Q-4.6 -.2 -2.4 2.6Q-1.2 4.2 -2.6 4.9L-4 3.6Q-5.3 -.5 -3.6 -3.4Z" fill="#d1d2d4"/><path d="M-.6 -4.9V-1.6Q.4 -2.5 1.4 -1.2Q3.2 1.8 2.2 4.8L.6 5Q1.4 2.4 -.2 -.4Q-1.2 -2 -.6 -4.9Z" fill="#d1d2d4"/></g>`;

  function boardSVG(players) {
    let h = `<defs>
      <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b96a33"/><stop offset="1" stop-color="#85441f"/></linearGradient>
      <pattern id="grain" width="3" height="3" patternUnits="userSpaceOnUse"><circle cx=".8" cy=".9" r=".32" fill="#000" fill-opacity=".1"/><circle cx="2.3" cy="2.2" r=".26" fill="#fff" fill-opacity=".08"/></pattern>
      <radialGradient id="gold" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff2a6"/><stop offset=".5" stop-color="#f7c61e"/><stop offset="1" stop-color="#d28a00"/></radialGradient>
      <radialGradient id="ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient>
      ${E.COLORS.map((c) => `<linearGradient id="t-${c}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${TOPC[c]}"/><stop offset="1" stop-color="${HEX[c]}"/></linearGradient>`).join('')}
    </defs>
    <rect x="-7" y="-7" width="114" height="116" rx="4.6" fill="url(#leather)" stroke="#4d2410" stroke-width=".6"/>
    <rect x="-7" y="-7" width="114" height="116" rx="4.6" fill="url(#grain)"/>
    <rect x="-6.3" y="-6.3" width="112.6" height="114.6" rx="4" fill="none" stroke="#e0a066" stroke-opacity=".5" stroke-width=".4"/>
    <rect x="-4.7" y="-4.7" width="109.4" height="111.6" rx="3" fill="none" stroke="#f6ecd9" stroke-width=".5" stroke-dasharray="1.7 1.1" stroke-linecap="round"/>
    <rect x="-3.5" y="-3.5" width="105.9" height="109.4" rx="3.3" fill="#0a0a0d"/>
    <rect x="-2.4" y="-2.4" width="104.8" height="107.2" rx="2.2" fill="#f8f8f4" stroke="#3a2010" stroke-width=".5"/>
    <text x="99.4" y="102.95" text-anchor="end" font-size="2.05" font-weight="800" letter-spacing=".05" fill="#15151a">Country Of Origin Uganda</text>`;
    // outer ring: 4 sides x 9 tiles – home corner, three stars, soldier, three stars, arrow
    for (let k = 0; k < E.RING; k++) {
      const [c, r] = ringXY(k), side = Math.floor(k / E.SIDE), j = k % E.SIDE, col = E.COLORS[side], [cx, cy] = cellXY(c, r);
      if (j === 4) { h += `<path d="${rr(c * 10 + .5, r * 10 + .5, 9, 9, 1.5, 1.5, 1.5, 1.5)}" fill="#0e0e12" stroke="#000" stroke-width=".3"/>` + soldier(cx, cy, col, side); continue; }
      const rad = [1.5, 1.5, 1.5, 1.5];
      if (j === 0) rad[side] = 3.6;                               // home corner: big rounded outer corner
      h += tile(c, r, col, rad);
      h += j === E.SIDE - 1 ? arrowGlyph(cx, cy, side, E.COLORS[(side + 1) % 4]) : starTile(cx, cy, col);
    }
    // interior: four triangular quarters (pip faces + the arrow lane of the next colour)
    for (let i = 0; i < 4; i++) {
      const col = E.COLORS[i];
      BASE.forEach(([r0, c0, type]) => {
        const [r, c] = rotCell(r0, c0, i), [cx, cy] = cellXY(c, r);
        h += tile(c, r, col, [1.5, 1.5, 1.5, 1.5]);
        if (type === 'arrow') h += arrowGlyph(cx, cy, i, E.COLORS[(i + 1) % 4]);
        else PIPS[type].forEach((o) => { const [dx, dy] = rotOff(o, i); h += pip(cx + dx, cy + dy); });
      });
    }
    // centre: the RANKCO logo
    h += `<rect x="40.5" y="40.5" width="19" height="19" rx="2.6" fill="#fff" stroke="#111" stroke-width=".9"/>`;
    h += window.LOGO_OK === false ? CENTRE_FALLBACK : `<image href="logo.png" x="44" y="44" width="12" height="12" preserveAspectRatio="xMidYMid meet"/>`;
    // the pot: spent coins pile up in the middle of the board
    if (players.length) h += '<g id="potg">' + Array.from({ length: 8 }, (_, k) => { const [x, y] = potXY(k);
      return `<g id="pot-${k}" style="display:none" transform="translate(${x.toFixed(2)} ${y.toFixed(2)})"><circle r="2.3" cx=".25" cy=".45" fill="rgba(0,0,0,.5)"/><use href="#rcoin" transform="scale(.044)"/></g>`; }).join('') + '</g>';
    // trays: waiting spots + the two recovery coins (3D tokens live in the HTML layer above the board)
    players.forEach((pl, pi) => {
      const [tx, ty] = TRAY[pl.color];
      h += `<rect x="${tx}" y="${ty}" width="${TRAY_W}" height="${TRAY_H}" rx="5" fill="rgba(6,6,12,.55)" stroke="${HEX[pl.color]}" stroke-width=".7"/>`;
      [0, 1].forEach((i) => {
        const [yx, yy] = yardXY(pl.color, i), [cx, cy] = coinXY(pl.color, i);
        h += `<rect x="${(yx - 3.7).toFixed(2)}" y="${(yy - 3.7).toFixed(2)}" width="7.4" height="7.4" rx="1.4" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-opacity=".7" stroke-width=".45" stroke-dasharray="1.2 .9"/>
              <g id="cs-${pi}-${i}" transform="translate(${cx} ${cy})"><circle class="slot" r="3.4" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.55)" stroke-width=".4" stroke-dasharray=".9 .8" style="display:none"/>
              <g class="cu"><circle r="3.5" cx=".3" cy=".55" fill="rgba(0,0,0,.4)"/><use href="#rcoin" transform="scale(.068)"/></g></g>`;
      });
    });
    return h;
  }

  /* ---- 3D tokens (HTML/CSS-3D layer above the SVG board) ---- */
  const SNOW = `<svg class="snow" viewBox="-10 -10 20 20" aria-hidden="true"><g fill="none" stroke="#2f7fb2" stroke-width="1.5" stroke-linecap="round">${[0, 60, 120, 180, 240, 300].map((a) => `<g transform="rotate(${a})"><path d="M0 0V-8.6M0 -4.6L-2.4 -6.8M0 -4.6L2.4 -6.8"/></g>`).join('')}</g><circle r="1.5" fill="#e9f9ff" stroke="#2f7fb2" stroke-width=".8"/></svg>`;
  const EDGE = Array.from({ length: 9 }, (_, k) => `<i style="--z:${(-0.6 + k * 0.15).toFixed(2)};--b:${(0.5 + k * 0.055).toFixed(2)}"></i>`).join('');
  function tokensHTML(players) {
    return players.map((pl, pi) => pl.tokens.map((t, ti) => `<div class="tok" id="tok-${pi}-${ti}" data-pi="${pi}" data-ti="${ti}" style="--c:${HEX[pl.color]};--base:${HEX[pl.color]};--hi:${LIGHT[pl.color]};--lo:${DARKC[pl.color]}">
      <div class="sc"><div class="shadow"></div><div class="glow"></div><div class="halo"></div>
        <div class="stage"><div class="tilt"><div class="hop"><div class="flip"><div class="edge">${EDGE}</div>
          <div class="face fFront"><span class="rk"></span><b>${ti + 1}</b></div>
          <div class="face fBack">${SNOW}<span class="fz">FROZEN</span><b>${ti + 1}</b></div>
        </div></div></div></div>
        <div class="hit"></div></div></div>`).join('')).join('');
  }
  function fitBoard() {
    const w = $('#boardWrap').clientWidth;
    if (w) $('#boardWrap').style.setProperty('--u', (w / 118) + 'px');
  }
  if (window.ResizeObserver) new ResizeObserver(fitBoard).observe($('#boardWrap')); else window.addEventListener('resize', fitBoard);

  /* ---- token layout ---- */
  function layout() {
    const s = app.session.state, groups = {};
    s.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => {
      const v = app.view[pi + '-' + ti];
      if (v.p >= 0 && v.p < E.GOAL) { const k = E.tileOf(pl, v.p); (groups[k] = groups[k] || []).push(pi + '-' + ti); }
    }));
    s.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => {
      const key = pi + '-' + ti, v = app.view[key], n = cIdx(pl.color);
      let x, y, sc = 1;
      if (v.p < 0) [x, y] = yardXY(pl.color, ti);
      else if (v.p >= E.GOAL) { [x, y] = doneXY(n, ti); sc = .62; }
      else {
        const k = E.tileOf(pl, v.p), g = groups[k], idx = g.indexOf(key);
        [x, y] = tileCenter(k);
        if (g.length === 2) { x += (idx ? 1 : -1) * 2.2; sc = .82; }
        else if (g.length > 2) { x += (idx % 2 ? 1 : -1) * 2.1; y += (idx < 2 ? -1 : 1) * 1.7; sc = .66; }
      }
      const el = $('#tok-' + key);
      el.style.setProperty('--x', x); el.style.setProperty('--y', y); el.style.setProperty('--s', sc);
      const fz = v.frozen ? '1' : '0';
      if (el.dataset.fz !== undefined && el.dataset.fz !== fz) {       // freeze / unfreeze → hop + flip
        el.classList.remove('flipF', 'flipU'); void el.offsetWidth;
        el.classList.add(v.frozen ? 'flipF' : 'flipU');
        clearTimeout(el._ft); el._ft = setTimeout(() => el.classList.remove('flipF', 'flipU'), 1200);
      }
      el.dataset.fz = fz;
      el.classList.toggle('frozen', !!v.frozen);
      const lv = v.p >= 0 && v.p < E.GOAL ? E.levelOf(v.p) : 0;
      $('.rk', el).textContent = '★'.repeat(lv);
      el.style.zIndex = 5 + Math.max(0, v.p);
    }));
  }
  function syncView() {
    app.view = {};
    app.session.state.players.forEach((pl, pi) => pl.tokens.forEach((t, ti) => { app.view[pi + '-' + ti] = { p: t.p, frozen: t.frozen }; }));
  }
  function renderCoins() {
    const s = app.session.state;
    let pot = 0;
    s.players.forEach((pl, pi) => { pot += pl.spent; [0, 1].forEach((i) => {
      const c = $('#cs-' + pi + '-' + i), on = i < pl.coins;
      $('.cu', c).style.display = on ? '' : 'none'; $('.slot', c).style.display = on ? 'none' : '';
    }); });
    $('#potN').textContent = pot;
    for (let k = 0; k < 8; k++) { const el = $('#pot-' + k); if (el) el.style.display = k < pot ? '' : 'none'; }
  }

  /* ===================================================================
     GAME – setup, rendering, loop
     =================================================================== */
  function startGame(again) {
    const mode = app.mode, s = ensureSetup(mode), seats = seatsOf(mode);
    const cfg = { players: seats.map((x) => ({ name: x.name, color: x.color, type: x.ai ? 'ai' : 'human', difficulty: x.ai ? s.difficulty : null })), startColor: s.first === 'random' ? null : s.first };
    if (app.online) olLeave(true);
    beginSession(cfg, E.createGame(cfg));
  }
  function beginSession(cfg, state) {
    app.session = { cfg, state };
    app.log = []; app.busy = false; app.loop++;
    $('#board').innerHTML = boardSVG(app.session.state.players);
    $('#tokens').innerHTML = tokensHTML(app.session.state.players); fitBoard();
    $$('.tok', $('#tokens')).forEach((el) => el.addEventListener('click', onTokenClick));
    $('#log').innerHTML = '';

  function optView(o, s) {

      case 'enter': return { i: '⭐', a: `Bring ${T} into play`, b: 'Rolled a 6', cls: 'good' };

      case 'setback_accept': return { i: '⏪', a: 'Accept the setback', b: `${T} goes back 6 tiles`, cls: 'danger' };

  function renderControls() {
    const s = app.session.state, box = $('#controls'), st = $('#status');

    app.opts = [];
    if (s.phase === 'over') { box.innerHTML = ''; st.innerHTML = 'Game over'; return; }
    if (app.busy || (app.online && app.online.sent)) { box.innerHTML = ''; return; }
    const actor = s.players[s.awaiting], mine = app.online ? s.awaiting === app.online.pid : actor.type !== 'ai';
    const auto = E.autoAction(s);
    if (!mine || auto) {
      st.innerHTML = auto && mine ? `${esc(actor.name)}<small>${auto.type === 'freeze' ? 'No other move – token freezes.' : auto.type === 'pass' ? 'No legal move.' : 'Only one move available.'}</small>` : `${esc(actor.name)}<small>is playing…</small>`;
      box.innerHTML = `<div class="thinking"><span></span><span></span><span></span>${mine ? '' : (app.online ? ' Waiting…' : ' Thinking…')}</div>`;
      return;
    }

      st.innerHTML = `${esc(actor.name)}'s turn<small>${s.bonus ? 'Bonus roll – you rolled a 6!' : 'Roll the dice.'}</small>`;

    } else if (s.phase === 'setback') {

      box.innerHTML = `<div class="alert">⚠ ${esc(by.name)} landed on your Token ${pd.victims[0].ti + 1}!</div>` + opts.map((o, k) => optBtn(o, k, s)).join('');
    } else {
      st.innerHTML = `${esc(actor.name)} rolled a ${s.roll}<small>${s.bonus ? 'Bonus roll · ' : ''}Choose what to do – or tap a glowing token.</small>`;
      box.innerHTML = opts.map((o, k) => optBtn(o, k, s)).join('');
      opts.forEach((o) => { if (!o.paid && ['move', 'enter', 'unfreeze'].includes(o.type)) $('#tok-' + s.awaiting + '-' + o.token).classList.add('can'); });

  function optBtn(o, i, s) { const v = optView(o, s); return `<button class="opt ${v.cls}" data-i="${i}"><span class="i">${v.i}</span><span>${v.a}<small>${v.b}</small></span></button>`; }

  function onTokenClick(e) {
    if (app.busy) return;
    const el = e.currentTarget, s = app.session.state;
    if (+el.dataset.pi !== s.awaiting) return;
    const o = app.opts.find((x) => !x.paid && x.token === +el.dataset.ti && ['move', 'enter', 'unfreeze'].includes(x.type));
    if (o && s.phase === 'act') dispatch(o);
  }

  /* ---- the single input path: human click, AI, (later) network ---- */
  async function dispatch(action) {
    if (app.online) return olSend(action);
    if (app.busy || !app.session) return;
    const my = app.loop, prev = app.session.state;
    const res = E.apply(prev, action);
    if (res.error) { console.warn(res); return; }
    app.busy = true; app.session.state = res.state; renderControls();
    await animate(res.events);
    if (my !== app.loop) return;
    app.busy = false; syncView(); renderAll(); loop();
  }

  async function loop() {
    const my = app.loop, s = app.session.state;
    if (s.phase === 'over') { await sleep(1300); if (my === app.loop) showResults(); return; }
    const actor = s.players[s.awaiting], auto = E.autoAction(s);
    if (auto) { await sleep(actor.type === 'ai' ? 650 : 1000); if (my === app.loop) dispatch(auto); return; }
    if (actor.type === 'ai') { await sleep(800); if (my === app.loop) dispatch(AI.choose(s, actor.difficulty)); }
  }

  async function animate(events) {
    const name = (pi) => nm(pi);
    for (const e of events) {
      const key = e.pi + '-' + e.ti, col = e.pi !== undefined ? HEX[app.session.state.players[e.pi].color] : '#fff';
      switch (e.t) {
        case 'roll': await rollDie(e.value); pushLog(`${name(e.pi)} rolled a <b>${e.value}</b>${e.bonus ? ' (bonus)' : ''}`); await sleep(280); break;
        case 'enter': app.view[key].p = 0; layout(); pushLog(`${name(e.pi)} brought Token ${e.ti + 1} into play${e.paid ? ' (1 coin)' : ''}`); await sleep(450); break;
        case 'move': {
          for (const p of e.path) {
            app.view[key].p = p; layout();
            if (p > 0 && E.isHome(p)) flash('★'.repeat(E.levelOf(p)) + ' ROUND ' + E.levelOf(p), col);
            await sleep(e.path.length > 3 ? 120 : 160);
          }
          const up = E.levelOf(e.to) > E.levelOf(e.from) && e.to < E.GOAL;
          pushLog(`${name(e.pi)} promoted Token ${e.ti + 1} by ${e.steps}${up ? ` → <b>${'★'.repeat(E.levelOf(e.to))}</b> (round ${E.levelOf(e.to)})` : ''}`);
          await sleep(200); break;
        }
        case 'salute': {
          const who = e.owner >= 0 ? name(e.owner) : `<span style="color:${LIGHT[e.ownerColor]}">${CNAME[e.ownerColor]}</span>`;
          pushLog(`🫡 ${who} salutes ${name(e.pi)} – <b>+3 bonus moves</b>`); flash('🫡 Salute! +3', col); await sleep(950); break;
        }
        case 'setback': {
          flash('SETBACK!', col); await sleep(380);
          for (const p of e.path.slice(1)) { app.view[key].p = p; layout(); await sleep(430); }
          pushLog(`⏪ ${name(e.pi)}'s Token ${e.ti + 1} ${e.to < 0 ? 'sent back off the board' : 'pushed back ' + (e.from - e.to) + ' tiles'} by ${name(e.by)}`); await sleep(250); break;
        }
        case 'hold': flash('HELD!', col); pushLog(`${COINI} ${name(e.pi)} paid a coin – Token ${e.ti + 1} holds its tile`); await sleep(700); break;
        case 'coin': await coinToCentre(e.pi); await sleep(120); break;
        case 'freeze': app.view[key].frozen = true; layout(); flash('❄ FROZEN', '#8fd3ff'); pushLog(`❄ ${name(e.pi)}'s Token ${e.ti + 1} is frozen`); await sleep(1150); break;
        case 'unfreeze': app.view[key].frozen = false; layout(); flash('UNFROZEN', '#6ff0a0'); pushLog(`🔥 ${name(e.pi)} unfroze Token ${e.ti + 1}${e.paid ? ' (1 coin)' : ''}`); await sleep(1050); break;
        case 'recover': pushLog(`${COINI} ${name(e.pi)} reclaimed a coin from the pot`); await coinFromCentre(e.pi); await sleep(200); break;
        case 'pass': pushLog(`${name(e.pi)} could not move`); await sleep(350); break;
        case 'finish': app.view[key].p = E.GOAL; layout(); flash('🏅 REACHED THE CENTRE', col); pushLog(`🏅 ${name(e.pi)}'s Token ${e.ti + 1} reached the centre!`); await sleep(1000); break;
        case 'bonus': flash('🎲 BONUS ROLL', col); await sleep(500); break;
        case 'win': pushLog(`🏆 <b>${name(e.pi)} wins!</b>`); break;
      }
    }
  }
  function renderCoinsLive(pi) { const s = app.session.state; renderCoins(); }
  /* a coin flies between a player's tray and the pot in the centre (timer based, so it also runs in background tabs) */
  const potCount = () => app.session.state.players.reduce((a, p) => a + p.spent, 0);
  function flyCoin(a, b, s0, s1, ms) {
    return new Promise((res) => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.innerHTML = '<circle r="3.6" cx=".4" cy=".7" fill="rgba(0,0,0,.35)"/><use href="#rcoin"/>';
      $('#board').appendChild(g);
      const t0 = performance.now();
      (function step() {
        const k = Math.min(1, (performance.now() - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, lift = Math.sin(Math.PI * e);
        const x = a[0] + (b[0] - a[0]) * e, y = a[1] + (b[1] - a[1]) * e - lift * 6, sc = (s0 + (s1 - s0) * e) * (1 + .6 * lift);
        g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${sc.toFixed(4)})`);
        if (k < 1) setTimeout(step, 16); else { g.remove(); res(); }
      })();
    });
  }
  async function coinToCentre(pi) {
    const pl = app.session.state.players[pi], slot = pl.coins;       // state is already final: the spent coin was the next free slot
    const c = $('#cs-' + pi + '-' + slot);
    if (!c || slot > 1) { renderCoins(); return; }
    $('.cu', c).style.display = 'none'; $('.slot', c).style.display = '';
    await flyCoin(coinXY(pl.color, slot), potXY(Math.max(0, potCount() - 1)), .068, .044, 700);
    renderCoins();
  }
  async function coinFromCentre(pi) {
    const pl = app.session.state.players[pi], slot = pl.coins - 1, k = potCount();
    const c = $('#cs-' + pi + '-' + slot);
    if (!c || slot < 0) { renderCoins(); return; }
    const pc = $('#pot-' + k); if (pc) pc.style.display = 'none';
    await flyCoin(potXY(k), coinXY(pl.color, slot), .044, .068, 700);
    renderCoins();
  }

  $('#gRules').onclick = () => modal(`<h3>RANKCO rules</h3><ul>
    <li><b>Goal:</b> be first to bring <b>both</b> tokens through <b>4 rounds</b> – one on each layer of the board – and into the centre.</li>
    <li><b>Enter:</b> roll a 6 to bring a token in – or spend 1 coin if you miss.</li>
    <li><b>Move:</b> roll and promote a token clockwise. Each round is played on its own layer, working inwards: round 1 on the outer ring (★), round 2 on the next ring (★★), round 3 (★★★), round 4 on the inner ring (★★★★). Each round ends on an arrow in your colour – it leads you into the next layer’s home corner, and the last arrow leads into the centre. Your own tokens can’t skip each other.</li>
    <li><b>Setbacks:</b> land on an opponent and their token goes back 6 tiles (repeating if that tile is taken). They can pay 1 coin to stay put.</li>
    <li><b>Salutation tile:</b> land on any soldier tile that isn’t your own colour’s (even if nobody is playing that colour) for 3 bonus moves.</li>
    <li><b>Rolling a 6</b> earns a bonus roll. On a bonus roll you may instead reclaim a spent coin.</li>
    <li><b>Freeze:</b> rolling a 1 with a token in round 3 or 4 (★★★ / ★★★★) freezes it – the token flips over to show its ice face. Frozen tokens can’t move or be set back. Unfreeze with a 6 or 1 coin. With a lower token in play you may promote that one instead.</li>
    <li><b>Home corners</b> are safe from setbacks and freezing.</li></ul>`, [{ label: 'Got it' }]);

  /* ===================================================================
     ONLINE PLAY  (FastAPI backend: REST for rooms, WebSocket for moves)
     The engine is deterministic: every accepted move (with the server's dice)
     is applied by both clients, so both boards stay identical. Offline modes
     never touch any of this.
     =================================================================== */
  const API_BASE = (() => {
    let u = window.RANKCO_API_URL || '';
    try {
      const q = new URLSearchParams(location.search).get('api');
      if (q) localStorage.setItem('rankco_api', q);
      u = q || localStorage.getItem('rankco_api') || u;
    } catch (e) {}
    return String(u).replace(/\/+$/, '');
  })();
  const API_SET = /^https?:\/\//.test(API_BASE) && !/YOUR-RANKCO/.test(API_BASE);
  const ol = { name: '', color: 'blue', code: '', state: 'idle', pinging: false, busy: false };

  function setConn(text, kind) {
    const c = $('#conn');
    c.textContent = text || '';
    c.className = 'conn' + (text ? ' show' : '') + (kind === 'warn' ? ' warn' : '');
  }
  function olShowStatus() {
    const el = $('#olStatus'); if (!el) return;
    const map = { wake: ['', 'Connecting to the game server… (it may take up to a minute to wake up)'], ok: ['ok', 'Server ready'], bad: ['bad', API_SET ? 'Cannot reach the game server. Check your connection and try again.' : 'Backend URL not set – edit RANKCO_API_URL at the top of index.html'], idle: ['', 'Connecting…'] };
    const m = map[ol.state] || map.idle;
    el.className = 'on-status ' + m[0]; $('span', el).textContent = m[1];
  }
  async function olPing() {
    if (ol.pinging) return;
    if (!API_SET) { ol.state = 'bad'; olShowStatus(); return; }
    ol.pinging = true; ol.state = 'wake'; olShowStatus();
    for (let i = 0; i < 12; i++) {
      try { const r = await fetch(API_BASE + '/health', { cache: 'no-store' }); if (r.ok) { ol.state = 'ok'; break; } } catch (e) {}
      if (i < 11) await sleep(3000);
    }
    if (ol.state !== 'ok') ol.state = 'bad';
    ol.pinging = false; olShowStatus();
  }
  async function olApi(path, body) {
    const r = await fetch(API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(typeof j.detail === 'string' ? j.detail : 'Request failed (' + r.status + ')');
    return j;
  }

        </div>
        <div class="on-err" id="olErr"></div>
      </div>`;
    $('#olBack').onclick = () => { renderModes(); go('modes'); };
    $('#olName').oninput = (e) => { ol.name = e.target.value; };
    $('#olCode').oninput = (e) => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); ol.code = e.target.value; };
    $('#olCode').onkeydown = (e) => { if (e.key === 'Enter') olJoin(); };
    $$('#onlineRoot .sw').forEach((b) => b.onclick = () => { ol.color = b.dataset.c; renderOnline(); });
    $('#olCreate').onclick = olCreate;
    $('#olJoin').onclick = olJoin;
    olShowStatus();
    if (ol.state !== 'ok') olPing();
  }
  const olErr = (t) => { const e = $('#olErr'); if (e) e.textContent = t || ''; };
  function olBusy(on) { ol.busy = on; ['olCreate', 'olJoin'].forEach((id) => { const b = $('#' + id); if (b) b.disabled = on; }); }

  async function olCreate() {
    if (ol.busy) return;
    if (!API_SET) { olErr('Backend URL not set – edit RANKCO_API_URL at the top of index.html'); return; }
    olBusy(true); olErr('');
    try { openRoom(await olApi('/api/rooms', { name: ol.name, color: ol.color })); }
    catch (e) { olErr(e.message === 'Failed to fetch' ? 'Cannot reach the game server.' : e.message); olBusy(false); }
  }
  async function olJoin() {
    if (ol.busy) return;
    const code = (ol.code || '').trim().toUpperCase();
    if (code.length < 4) { olErr('Enter the room code from your friend.'); return; }
    if (!API_SET) { olErr('Backend URL not set – edit RANKCO_API_URL at the top of index.html'); return; }
    olBusy(true); olErr('');
    try { openRoom(await olApi('/api/rooms/' + encodeURIComponent(code) + '/join', { name: ol.name, color: ol.color })); }
    catch (e) { olErr(e.message === 'Failed to fetch' ? 'Cannot reach the game server.' : e.message); olBusy(false); }
  }
  function openRoom(j) {
    olBusy(false);
    app.online = { code: j.code, token: j.token, seat: j.seat, pid: null, status: j.seat === 0 ? 'waiting' : 'joining', ws: null,
                   q: [], pumping: false, recv: 0, sent: false, started: false, left: false, tries: 0, seats: [] };
    renderLobby(); olConnect();
  }
  function renderLobby() {
    const o = app.online, host = o.seat === 0;
    $('#onlineRoot').innerHTML = `
      <button class="back" id="olCancel">‹ Cancel</button>
      <h2 class="pill-title">${host ? 'Waiting for opponent' : 'Joining game'}</h2>
      <div class="on-card glass" style="text-align:center">
        <div class="lbl">Room code</div>
        <div class="bigcode">${esc(o.code)}</div>
        ${host ? `<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px">
          <button class="btn" id="olCopy">Copy code</button><button class="btn dark" id="olLink">Copy invite link</button></div>` : ''}
        <div class="thinking" style="justify-content:center"><span></span><span></span><span></span> ${host ? 'Waiting for your friend to join…' : 'Connecting to the match…'}</div>
      </div>`;
    $('#olCancel').onclick = () => { olLeave(true); renderOnline(); };
    const cp = (txt, btn) => { try { navigator.clipboard.writeText(txt); const t = btn.textContent; btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = t; }, 1400); } catch (e) {} };
    if (host) {
      $('#olCopy').onclick = (e) => cp(o.code, e.currentTarget);
      $('#olLink').onclick = (e) => cp(location.href.split('#')[0].split('?')[0] + '?room=' + o.code, e.currentTarget);
    }
  }

  /* ---- socket ---- */
  function olConnect() {
    const o = app.online; if (!o || o.left) return;
    const ws = new WebSocket(API_BASE.replace(/^http/, 'ws') + '/ws/' + encodeURIComponent(o.code) + '?token=' + encodeURIComponent(o.token));
    o.ws = ws;
    let hb = 0;
    ws.onopen = () => { o.tries = 0; setConn(''); hb = setInterval(() => { try { ws.send('{"type":"ping"}'); } catch (e) {} }, 25000); };
    ws.onmessage = (ev) => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (app.online === o) olOnMessage(o, m); };
    ws.onclose = () => {
      clearInterval(hb);
      if (o.ws !== ws || o.left || app.online !== o) return;
      setConn('Connection lost – reconnecting…');
      o.tries++; setTimeout(() => { if (app.online === o && !o.left) olConnect(); }, Math.min(800 * o.tries, 5000));
    };
    ws.onerror = () => {};
  }
  function olResync() { const o = app.online; if (o && o.ws && o.ws.readyState === 1) o.ws.send('{"type":"sync"}'); }

  function olOnMessage(o, m) {
    switch (m.type) {
      case 'state': olState(o, m); break;
      case 'chat': chatPush(m.msg, true); break;
      case 'chat_err': toast(m.error || 'Message not sent'); break;
      case 'rtc': rtcOnMessage(m); break;
      case 'action':
        if (!o.started) break;
        if (m.seq < o.recv) break;                                   // already have it
        if (m.seq > o.recv) { olResync(); break; }                   // gap → full resync
        o.recv++; o.q.push(m); olPump(); break;
      case 'presence': {
        o.seats = m.seats; commsPresence();
        const opp = m.seats.find((x) => x.pid !== o.pid && x.pid !== null);
        const over = app.session && app.session.state.phase === 'over';
        if (o.started && !over && opp && !opp.online) setConn('Opponent disconnected – waiting for them to return…', 'warn');
        else if (o.ws && o.ws.readyState === 1) setConn('');
        break;
      }
      case 'reject': o.sent = false; if (m.reason === 'seq') olResync(); else { renderControls(); } break;
      case 'left': {
        const over = app.session && app.session.state && app.session.state.phase === 'over';
        if (over) break;
        olLeave(false);
        modal('<h3>Opponent left</h3><p>Your opponent left the match.</p>', [{ label: 'Back to menu', fn: () => { renderModes(); go('modes'); } }]);
        break;
      }
      case 'error':
        if (m.fatal) { olLeave(false); renderOnline(); olErr(m.error || 'Connection error'); go('online'); }
        break;
    }
  }
  function olState(o, m) {
    o.seats = m.seats; o.pid = m.pid; o.status = m.status; commsState(o, m);
    if (m.status === 'closed') {
      olLeave(false);
      modal('<h3>Room closed</h3><p>This match has ended.</p>', [{ label: 'Back to menu', fn: () => { renderModes(); go('modes'); } }]);
      return;
    }
    if (m.status !== 'playing') return;                             // still waiting for the second player
    if (!o.started || m.force || m.log.length < o.recv) { olStart(o, m); return; }
    for (const e of m.log.slice(o.recv)) { o.recv++; o.q.push(e); }  // reconnect: catch up on missed moves
    o.sent = false;
    if (o.q.length) olPump(); else { renderAll(); loop(); }
  }
  function olStart(o, m) {
    let st = E.createGame(m.cfg);
    for (const e of m.log) {
      const r = E.apply(st, e.action, { dice: e.dice });
      if (r.error) { console.warn('replay stopped', r, e); break; }
      st = r.state;
    }
    o.started = true; o.recv = m.log.length; o.q = []; o.pumping = false; o.sent = false;
    setConn('');
    beginSession(m.cfg, st);
    if (m.log.length) pushLog('Match restored.');
  }

  /* ---- sending / receiving moves ---- */
  function olSend(action) {
    const o = app.online, s = app.session && app.session.state;
    if (!o || !s || !o.started || o.left || app.busy || o.sent || o.pumping || o.q.length || s.phase === 'over') return;
    if (s.awaiting !== o.pid || !o.ws || o.ws.readyState !== 1) return;
    if (!E.listOptions(s).some((x) => x.type === action.type && (x.token === undefined || x.token === action.token))) return;
    const a = { type: action.type }; if (action.token !== undefined) a.token = action.token; if (action.paid) a.paid = true;
    o.sent = true;
    o.ws.send(JSON.stringify({ type: 'action', seq: o.recv, pid: o.pid, action: a }));
    renderControls();
  }
  async function olPump() {
    const o = app.online;
    if (!o || o.pumping || !o.started) return;
    o.pumping = true;
    const my = app.loop;
    while (o.q.length) {
      const m = o.q.shift(), s = app.session.state;
      if (s.phase === 'over') continue;
      const res = s.awaiting === m.pid ? E.apply(s, m.action, { dice: m.dice }) : { error: 'not their turn' };
      if (res.error) { console.warn('out of sync', res, m); o.pumping = false; o.q = []; olResync(); return; }
      app.busy = true; app.session.state = res.state; o.sent = false; renderControls();
      await animate(res.events);
      if (my !== app.loop) { o.pumping = false; return; }
      app.busy = false; syncView(); renderAll();
    }
    o.pumping = false;
    loop();
  }
  function olLeave(notify) {
    const o = app.online; if (!o) return;
    o.left = true;
    if (call.st !== 'idle') rtcSend({ kind: 'hangup' });
    commsStop();
    try { if (notify && o.ws && o.ws.readyState === 1) o.ws.send('{"type":"leave"}'); if (o.ws) o.ws.close(); } catch (e) {}
    app.online = null; app.loop++; app.busy = false; setConn('');
  }

  /* leaving an online match from the board */
  (function () {
    const orig = $('#gBack').onclick;
    $('#gBack').onclick = () => {
      if (!app.online) return orig();
      modal('<h3>Leave this match?</h3><p>Leaving ends the online match for both players.</p>',
        [{ label: 'Keep playing', dark: true }, { label: 'Leave match', fn: () => { olLeave(true); renderModes(); go('modes'); } }]);
    };
  })();

  /* ---- welcome-screen decoration: waiting trays, tokens, coins and two dice lying on the tilted board ---- */
  function trayDecor() {
    return E.COLORS.map((c) => {
      const [tx, ty] = TRAY[c];
      let s = `<rect x="${tx}" y="${ty}" width="${TRAY_W}" height="${TRAY_H}" rx="5" fill="rgba(6,6,12,.55)" stroke="${HEX[c]}" stroke-width=".7"/>`;
      [0, 1].forEach((i) => {
        const [yx, yy] = yardXY(c, i), [cx, cy] = coinXY(c, i);
        s += `<rect x="${(yx - 3.7).toFixed(2)}" y="${(yy - 3.7).toFixed(2)}" width="7.4" height="7.4" rx="1.4" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-opacity=".7" stroke-width=".45" stroke-dasharray="1.2 .9"/>` +
             `<circle cx="${cx}" cy="${cy}" r="3.4" fill="rgba(0,0,0,.25)" stroke="rgba(255,255,255,.55)" stroke-width=".4" stroke-dasharray=".9 .8"/>`;
      });
      return s;
    }).join('');
  }
  function bgPropsHTML() {
    const at = (x, y) => `left:${((x + 9) / 118 * 100).toFixed(3)}%;top:${((y + 21) / 144 * 100).toFixed(3)}%`;
    const token = (color, xy, n, dl) => `<div class="bp bt" style="${at(xy[0], xy[1])};--tc:${HEX[color]};--hi:${LIGHT[color]};--lo:${DARKC[color]};--dl:${dl}s"><div class="sh"></div><div class="bk">` +
      Array.from({ length: 6 }, (_, k) => `<i style="--z:${(k * .28).toFixed(2)};--p:${38 + k * 9}%"></i>`).join('') + `<div class="tp"><b>${n}</b></div></div></div>`;
    const coin = (xy, dl) => `<div class="bp bc" style="${at(xy[0], xy[1])};--dl:${dl}s"><div class="sh"></div><div class="bk">` +
      Array.from({ length: 4 }, (_, k) => `<i style="--z:${(k * .3).toFixed(2)};--p:${45 + k * 16}%"></i>`).join('') +
      `<div class="cf"><svg viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg></div><div class="cb"><svg viewBox="-50 -50 100 100" aria-hidden="true"><use href="#rcoin"/></svg></div></div></div>`;
    const PAT = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    const face = (n) => `<div class="face f${n}">${Array.from({ length: 9 }, (_, i) => `<i class="${PAT[n].includes(i) ? 'on' : ''}"></i>`).join('')}</div>`;
    const die = (x, y, dl) => `<div class="bp bd" style="${at(x, y)};--dl:${dl}s"><div class="sh"></div><div class="dh"><div class="cube">${[1, 2, 3, 4, 5, 6].map(face).join('')}</div></div></div>`;
    let out = '';
    E.COLORS.forEach((c, ci) => {
      out += token(c, yardXY(c, 1), 2, -ci * .8);                       // second token still waiting in its tray
      [0, 1].forEach((i) => { out += coin(coinXY(c, i), -(ci * 1.7 + i * .9)); });   // the two recovery coins
    });
    [[E.START_INDEX.blue + 3, 'blue'], [E.START_INDEX.red + 3, 'red'], [E.START_INDEX.green + 3, 'green'], [E.START_INDEX.orange + 3, 'orange']].forEach(([k, c], i) => {
      const [col, row] = ringXY(k); out += token(c, cellXY(col, row), 1, -i * .7);        // first token of each colour out on the board
    });
    [0, 1, 2].forEach((k) => { out += coin(potXY(k), -k * 1.4 - .5); });                 // coins in the pot at the centre
    out += die(16, 16, 0) + die(78, 72, -4.5);
    return out;
  }

  /* ===================================================================
     ONLINE COMMS: text chat, emoji reactions and a WebRTC voice call.
     Everything travels over the same WebSocket as the moves; audio itself
     goes peer-to-peer (the server only relays the call set-up messages).
     =================================================================== */
  const EMOJIS = ['😂', '🤣', '😭', '😎', '😈', '🤡', '💀', '🔥', '👏', '🙈', '😡', '🥶', '😴', '🤯', '🍀', '🎲', '💸', '🤝', '🫡', '🥳', '🙏', '😜', '🤪', '👀'];
  const QUICK = ['GG 🤝', 'Nice move!', 'Oops 😅', 'Hurry up ⏰', 'Good luck 🍀', 'Rematch? 🔁'];
  const cm = { open: false, unread: 0, seen: -1, toastT: 0, tT: 0 };
  const call = { st: 'idle', pc: null, stream: null, muted: false, t0: 0, tick: 0, ice: [], offer: null, tmo: 0, ring: 0, dis: 0 };
  const seatInfo = (s) => (app.online && app.online.seats ? app.online.seats[s] : null);
  const oppInfo = () => (app.online ? seatInfo(1 - app.online.seat) : null);
  function wsSend(obj) { const o = app.online; if (o && o.ws && o.ws.readyState === 1) { o.ws.send(JSON.stringify(obj)); return true; } return false; }
  const rtcSend = (m) => wsSend(Object.assign({ type: 'rtc' }, m));
  function toast(text) {
    const t = $('#toast'); t.textContent = text; t.hidden = false;
    clearTimeout(cm.tT); cm.tT = setTimeout(() => { t.hidden = true; }, 3200);
  }

  function commsInit() {
    const btns = EMOJIS.map((e) => `<button type="button" data-e="${e}" aria-label="Send ${e}">${e}</button>`).join('');
    $('#emoPop').innerHTML = btns; $('#cpEmo').innerHTML = btns;
    $('#cpQuick').innerHTML = QUICK.map((q) => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('');
    $('#emoPop').onclick = (e) => { const b = e.target.closest('[data-e]'); if (b) { sendEmoji(b.dataset.e); $('#emoPop').hidden = true; } };
    $('#cpEmo').onclick = (e) => { const b = e.target.closest('[data-e]'); if (b) sendEmoji(b.dataset.e); };
    $('#cpQuick').onclick = (e) => { const b = e.target.closest('[data-q]'); if (b) sendChat(b.dataset.q); };
    $('#dkEmo').onclick = () => { const p = $('#emoPop'); p.hidden = !p.hidden; if (!p.hidden) chatClose(); };
    $('#dkChat').onclick = () => (cm.open ? chatClose() : chatOpen());
    $('#cpClose').onclick = chatClose;
    $('#dkMic').onclick = callBtn; $('#cpCall').onclick = callBtn;
    $('#cpForm').onsubmit = (e) => { e.preventDefault(); const i = $('#cpIn'); if (sendChat(i.value)) i.value = ''; };
    $('#chatToast').onclick = () => chatOpen();
    $('#callPill').onclick = (e) => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      ({ accept: callAccept, decline: callDecline, end: callHangup, mute: callMute })[b.dataset.a]();
    };
    document.addEventListener('click', (e) => { const p = $('#emoPop'); if (!p.hidden && !e.target.closest('#emoPop, #dkEmo')) p.hidden = true; });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#emoPop').hidden = true; if (cm.open) chatClose(); } });
  }
  function commsState(o, m) {
    if (m.ice) o.ice = m.ice;
    o.chat = Array.isArray(m.chat) ? m.chat : [];
    const playing = m.status === 'playing';
    document.body.classList.toggle('olive', playing);
    if (!playing) return;
    chatHead(); chatRecount();
    if (cm.open) chatRender();
  }
  function commsPresence() { chatHead(); callUi(); }
  function commsStop() {
    callEnd(null);
    chatClose(); cm.unread = 0; cm.seen = -1; badge();
    document.body.classList.remove('olive');
    $('#emoPop').hidden = true; $('#chatToast').hidden = true; $('#toast').hidden = true; $('#reactLayer').innerHTML = '';
    $('#cpList').innerHTML = '';
  }

  /* ---- text chat + reactions ---- */
  function sendChat(text) {
    text = String(text || '').trim(); if (!text) return false;
    if (!wsSend({ type: 'chat', text })) { toast('Reconnecting… try again in a moment'); return false; }
    return true;
  }
  function sendEmoji(e) { if (!wsSend({ type: 'emoji', emoji: e })) toast('Reconnecting… try again in a moment'); }
  function badge() { const b = $('#chatBdg'); b.hidden = !cm.unread; b.textContent = cm.unread > 9 ? '9+' : cm.unread; }
  function chatHead() {
    const opp = oppInfo(); if (!opp) return;
    $('#cpName').textContent = opp.name; $('#cpDot').style.setProperty('--c', HEX[opp.color] || '#999');
    $('#cpSub').textContent = opp.online ? (call.st === 'connected' ? 'online · on a voice call' : 'online') : 'offline – messages will wait';
  }
  function chatRecount() {
    const o = app.online, list = o.chat || [], last = list.length ? list[list.length - 1].id : -1;
    if (cm.open) { cm.seen = last; cm.unread = 0; }
    else cm.unread = list.filter((x) => x.kind === 'm' && x.seat !== o.seat && x.id > cm.seen).length;
    badge();
  }
  function chatRender() {
    const o = app.online, box = $('#cpList'); if (!o) return;
    if (!o.chat || !o.chat.length) { box.innerHTML = '<div class="cp-empty">No messages yet.<br>Say hi 👋 or throw a 😂</div>'; return; }
    box.innerHTML = o.chat.map((m) => {
      const mine = m.seat === o.seat, si = seatInfo(m.seat) || {};
      const t = new Date(m.ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return `<div class="msg${mine ? ' me' : ''}${m.kind === 'e' ? ' e' : ''}">${mine || m.kind === 'e' ? '' : `<b style="color:${LIGHT[si.color] || '#fff'}">${esc(si.name || 'Opponent')}</b>`}${esc(m.text)}<i>${t}</i></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }
  function chatOpen() {
    const o = app.online; if (!o) return;
    cm.open = true; $('#chatPanel').hidden = false; $('#emoPop').hidden = true; $('#chatToast').hidden = true;
    chatHead(); chatRecount(); chatRender();
    if (window.matchMedia && matchMedia('(hover:hover)').matches) $('#cpIn').focus();
  }
  function chatClose() { cm.open = false; $('#chatPanel').hidden = true; }
  function chatPush(msg, live) {
    const o = app.online; if (!o || !msg) return;
    o.chat = o.chat || [];
    if (o.chat.some((x) => x.id === msg.id)) return;
    o.chat.push(msg); if (o.chat.length > 100) o.chat.shift();
    if (live && msg.kind === 'e') reactFloat(msg);
    if (cm.open) { cm.seen = msg.id; chatRender(); return; }
    if (msg.kind === 'm' && msg.seat !== o.seat) {
      cm.unread++; badge();
      const si = seatInfo(msg.seat) || {}, el = $('#chatToast');
      el.style.setProperty('--c', LIGHT[si.color] || '#fff');
      el.innerHTML = `<b>${esc(si.name || 'Opponent')}</b>${esc(msg.text.slice(0, 120))}`; el.hidden = false;
      clearTimeout(cm.toastT); cm.toastT = setTimeout(() => { el.hidden = true; }, 3800);
    }
  }
  function reactFloat(msg) {
    const o = app.online, si = seatInfo(msg.seat) || {}, mine = msg.seat === o.seat;
    const el = document.createElement('div'); el.className = 'rx';
    el.style.left = (6 + Math.random() * 72) + '%';
    el.style.setProperty('--sw', (Math.random() * 70 - 35).toFixed(0) + 'px'); el.style.setProperty('--c', HEX[si.color] || '#fff');
    el.innerHTML = `<span>${esc(msg.text)}</span><small>${mine ? 'You' : esc(si.name || '')}</small>`;
    $('#reactLayer').appendChild(el); setTimeout(() => el.remove(), 3000);
  }

  /* ---- voice call (WebRTC) ---- */
  let actx = null;
  function beep(freq, dur) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  function ringStart() {
    ringStop();
    const r = () => { beep(660, .18); setTimeout(() => beep(880, .18), 230); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} };
    r(); call.ring = setInterval(r, 2200);
  }
  function ringStop() { clearInterval(call.ring); call.ring = 0; }
  const getMic = () => navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
  function stopStream() { if (call.stream) { call.stream.getTracks().forEach((t) => t.stop()); call.stream = null; } }
  const oppOnline = () => { const s = oppInfo(); return !!(s && s.online); };

  function callUi() {
    const pill = $('#callPill'), opp = oppInfo(), name = esc(opp ? opp.name : 'Opponent'), mic = $('#dkMic'), cp = $('#cpCall');
    mic.className = 'dk' + (call.st === 'connected' ? ' live' : call.st === 'ringing' ? ' ring' : '');
    cp.className = 'cp-btn' + (call.st === 'connected' ? ' live' : '');
    mic.textContent = cp.textContent = call.st === 'idle' ? '🎙' : '📞';
    if (call.st === 'idle') { pill.hidden = true; return; }
    pill.hidden = false; pill.className = 'call-pill' + (call.st === 'ringing' ? ' ringing' : '');
    if (call.st === 'ringing') pill.innerHTML = `<span class="pd"></span><span>📞 ${name} is calling…</span><button class="ok" data-a="accept">Accept</button><button class="no" data-a="decline">Decline</button>`;
    else if (call.st === 'calling') pill.innerHTML = `<span class="pd"></span><span>Calling ${name}…</span><button class="no" data-a="end">Cancel</button>`;
    else if (call.st === 'connecting') pill.innerHTML = `<span class="pd"></span><span>Connecting…</span><button class="no" data-a="end">End</button>`;
    else pill.innerHTML = `<span class="pd"></span><span>🎙 <span id="callTm">${callTime()}</span></span><button class="ic${call.muted ? ' muted' : ''}" data-a="mute" aria-label="${call.muted ? 'Unmute' : 'Mute'}">${call.muted ? '🔇' : '🎤'}</button><button class="ic no" data-a="end" aria-label="End call">📵</button>`;
    chatHead();
  }
  function callTime() { const s = call.t0 ? Math.floor((Date.now() - call.t0) / 1000) : 0; return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function callEnd(reason) {
    clearTimeout(call.tmo); clearTimeout(call.dis); clearInterval(call.tick); ringStop();
    if (call.pc) { try { call.pc.onconnectionstatechange = null; call.pc.close(); } catch (e) {} }
    stopStream();
    const a = $('#remoteAudio'); if (a) a.srcObject = null;
    Object.assign(call, { st: 'idle', pc: null, offer: null, ice: [], muted: false, t0: 0, tick: 0 });
    callUi();
    if (reason) toast(reason);
  }
  function callConnected() {
    if (call.st === 'connected') return;
    call.st = 'connected'; call.t0 = Date.now(); clearTimeout(call.tmo);
    clearInterval(call.tick); call.tick = setInterval(() => { const el = $('#callTm'); if (el) el.textContent = callTime(); }, 1000);
    callUi();
  }
  function makePc() {
    const o = app.online;
    const pc = new RTCPeerConnection({ iceServers: (o && o.ice) || [{ urls: 'stun:stun.l.google.com:19302' }] });
    pc.onicecandidate = (e) => { if (e.candidate) rtcSend({ kind: 'ice', candidate: e.candidate.toJSON() }); };
    pc.ontrack = (e) => { const a = $('#remoteAudio'); a.srcObject = e.streams[0] || new MediaStream([e.track]); a.play().catch(() => {}); };
    pc.onconnectionstatechange = () => {
      if (call.pc !== pc) return;
      const s = pc.connectionState;
      if (s === 'connected') { clearTimeout(call.dis); callConnected(); }
      else if (s === 'disconnected') { clearTimeout(call.dis); call.dis = setTimeout(() => { if (call.pc === pc && pc.connectionState !== 'connected') callEnd('Voice call lost'); }, 7000); }
      else if (s === 'failed') callEnd('Voice connection failed – the network blocked it');
    };
    call.pc = pc;
    call.stream.getTracks().forEach((t) => pc.addTrack(t, call.stream));
    return pc;
  }
  function flushIce() { const pc = call.pc; if (!pc) return; call.ice.splice(0).forEach((c) => pc.addIceCandidate(c).catch(() => {})); }
  async function callBtn() {
    if (!app.online) return;
    if (call.st === 'idle') return callStart();
    if (call.st === 'ringing') return callAccept();
    callHangup();
  }
  async function callStart() {
    if (!app.online || call.st !== 'idle') return;
    if (!oppOnline()) { toast('Your opponent is offline right now'); return; }
    if (!navigator.mediaDevices || !window.RTCPeerConnection) { toast('Voice calls are not supported in this browser (needs https)'); return; }
    call.st = 'calling'; callUi();
    try { call.stream = await getMic(); } catch (e) { callEnd('Microphone blocked – allow it in your browser settings'); return; }
    if (call.st !== 'calling') { stopStream(); return; }
    try {
      const pc = makePc(), offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      rtcSend({ kind: 'offer', sdp: offer.sdp });
    } catch (e) { callEnd('Could not start the call'); return; }
    call.tmo = setTimeout(() => { if (call.st === 'calling') { rtcSend({ kind: 'hangup' }); callEnd('No answer'); } }, 45000);
  }
  async function callAccept() {
    if (call.st !== 'ringing') return;
    ringStop(); clearTimeout(call.tmo);
    const offer = call.offer; call.st = 'connecting'; callUi();
    try { call.stream = await getMic(); } catch (e) { rtcSend({ kind: 'decline' }); callEnd('Microphone blocked – allow it in your browser settings'); return; }
    if (call.st !== 'connecting') { stopStream(); return; }
    try {
      const pc = makePc();
      await pc.setRemoteDescription({ type: 'offer', sdp: offer }); flushIce();
      const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
      rtcSend({ kind: 'answer', sdp: ans.sdp });
    } catch (e) { rtcSend({ kind: 'hangup' }); callEnd('Could not join the call'); }
  }
  function callDecline() { rtcSend({ kind: 'decline' }); callEnd(null); }
  function callHangup() { if (call.st === 'ringing') return callDecline(); if (call.st !== 'idle') { rtcSend({ kind: 'hangup' }); callEnd(null); } }
  function callMute() {
    if (!call.stream) return;
    call.muted = !call.muted; call.stream.getAudioTracks().forEach((t) => { t.enabled = !call.muted; });
    callUi();
  }
  function rtcOnMessage(m) {
    const o = app.online; if (!o) return;
    switch (m.kind) {
      case 'offer':
        if (call.st === 'calling') { if (o.seat === 0) return; callEnd(null); }      // both dialled at once: seat 0 wins
        if (call.st !== 'idle') { rtcSend({ kind: 'busy' }); return; }
        call.st = 'ringing'; call.offer = m.sdp; ringStart(); callUi();
        call.tmo = setTimeout(() => { if (call.st === 'ringing') callDecline(); }, 45000);
        break;
      case 'answer':
        if (call.pc && call.st === 'calling') {
          call.st = 'connecting'; clearTimeout(call.tmo); callUi();
          call.pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).then(flushIce).catch(() => callEnd('Call failed'));
        }
        break;
      case 'ice':
        if (call.pc && call.pc.remoteDescription) call.pc.addIceCandidate(m.candidate).catch(() => {}); else call.ice.push(m.candidate);
        break;
      case 'hangup': callEnd(call.st === 'ringing' ? 'Missed call' : (call.st === 'idle' ? null : 'Call ended')); break;
      case 'decline': callEnd('Call declined'); break;
      case 'busy': callEnd('Opponent is busy'); break;
      case 'unavailable': callEnd('Opponent is offline'); break;
    }
  }

  /* ---- boot ---- */
  buildOrbit(); commsInit();
  (function buildSparks() {                                  // drifting gold sparks on page 2
    let h = '';
    for (let i = 0; i < 26; i++) {
      const sz = 3 + Math.random() * 6;
      h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${sz.toFixed(1)}px;height:${sz.toFixed(1)}px;--dx:${(Math.random() * 80 - 40).toFixed(0)}px;animation-duration:${(7 + Math.random() * 9).toFixed(1)}s;animation-delay:${(Math.random() * 9).toFixed(1)}s"></i>`;
    }
    $('#sparks').innerHTML = h;
  })();
  /* landing page: after 3 seconds it leaves by itself and page 2 (the board behind the title) appears */
  setTimeout(() => {
    if (app.screen !== 'splash') return;
    $('#bgBoard').innerHTML = boardSVG([]) + trayDecor();    // the real board artwork + waiting trays
    $('#bgProps').innerHTML = bgPropsHTML();
    let room = '';
    try { room = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); } catch (e) {}
    if (room) { app.mode = 'online'; ol.code = room; renderOnline(); go('online'); } else go('welcome');
  }, 3000);
  window.RANKCO = { E, AI, app };   // handy for future online adapters / debugging
})();

</script>
